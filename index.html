<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compostic — Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root{
    --brand:#3E7B54; --brand-deep:#2E5C3F; --brand-light:#E4EFE2; --brand-mid:#4E9E8A;
    --magenta:#3E7B54; --purple:#4E9E8A; --purple-deep:#2E5C3F; --orange:#E8944A;
    --accent:#E8944A; --accent-soft:#F3C79B; --accent-deep:#B5641E; --accent-pale:#FBEBD9;
    --cream:#F4F1E9; --cream-deep:#E9E4D6; --paper:#FFFFFF;
    --ink:#25291F; --ink-soft:#5F6657; --border:#E4E0D2;
    --coral:#E8944A; --teal:#4E9E8A; --pink:#4E9E8A; --green:#3E7B54; --green-deep:#2E5C3F;
    --hi:#3E7B54; --warn:#C77A2E;
    --shadow:0 2px 10px rgba(37,41,31,.08); --shadow-lg:0 16px 46px rgba(37,41,31,.18);
    --hard:4px 4px 0 var(--brand-deep); --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,h4{font-family:'Quicksand','Quicksand','Nunito',sans-serif}
  a{color:inherit}
  ::selection{background:var(--accent);color:var(--brand-deep)}

  .app{display:grid;grid-template-columns:214px 1fr;min-height:100vh}

  /* Sidebar */
  .side{background:var(--brand-deep);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .logo{margin-bottom:16px}
  .logo-blocks{display:flex;gap:3px;margin-bottom:7px}
  .blk{width:27px;height:27px;border-radius:6px;display:grid;place-items:center;font-family:'Quicksand';font-weight:900;font-size:15px;color:var(--brand-deep);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .logo-name{font-family:'Quicksand';font-weight:900;font-size:18px;letter-spacing:.01em;line-height:1;color:#fff}
  .logo-sub{font-size:10px;color:var(--accent);font-style:italic;font-family:'Fraunces';margin-top:3px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:700;color:#C9BEE8;transition:.15s;border:none;background:none;text-align:left;width:100%;font-family:'Nunito'}
  .nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
  .nav-item.on{background:var(--brand);color:#fff}
  .nav-item .ico{font-size:15px}
  .nav-new{font-size:8px;background:var(--accent);color:var(--brand-deep);padding:1px 6px;border-radius:20px;margin-left:auto;letter-spacing:.04em;font-weight:800}
  .nav-wip{font-size:8px;background:rgba(255,255,255,.15);padding:1px 6px;border-radius:20px;margin-left:auto;letter-spacing:.05em}
  .side-spacer{flex:1;min-height:14px}
  .btn-chunky{background:var(--accent-soft);color:var(--brand-deep);border:2px solid var(--brand-deep);padding:11px;border-radius:14px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Quicksand';display:flex;align-items:center;gap:7px;justify-content:center;box-shadow:3px 3px 0 var(--brand-deep);transition:.12s}
  .btn-chunky:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--brand-deep)}
  .btn-chunky:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--brand-deep)}
  .howlink{background:none;border:none;color:#9385C4;font-size:11px;cursor:pointer;padding:8px;text-align:center;font-weight:700}
  .howlink:hover{color:#fff}

  /* Main */
  .main{padding:0 0 60px;min-width:0}
  .page-head{padding:26px 34px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .page-head h1{font-size:32px;font-weight:900;margin:0 0 4px;letter-spacing:-.01em;color:var(--brand)}
  .page-head .dek{font-family:'Fraunces';font-style:italic;font-size:15px;color:var(--ink-soft);margin:0;max-width:660px;line-height:1.4}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-pale);border:1.5px solid var(--brand);padding:6px 13px;border-radius:30px;font-size:11.5px;font-weight:800;white-space:nowrap;color:var(--brand)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--hi);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,167,109,.5)}70%{box-shadow:0 0 0 7px rgba(58,167,109,0)}100%{box-shadow:0 0 0 0 rgba(58,167,109,0)}}

  .ticker{background:var(--brand-deep);color:#fff;overflow:hidden;white-space:nowrap;padding:9px 0;margin:0 0 18px}
  .ticker-track{display:inline-block;animation:scroll 72s linear infinite}
  .ticker-track span{margin:0 15px;font-size:11.5px;font-family:'JetBrains Mono'}
  .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  .wrap{padding:0 34px}
  .section-eyebrow{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;margin:26px 0 12px;font-weight:700}

  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 20px}
  .subtab{background:var(--paper);border:1.5px solid var(--border);padding:8px 14px;border-radius:30px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--ink-soft);transition:.15s;font-family:'Nunito'}
  .subtab:hover{border-color:var(--brand)}
  .subtab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .subtab .badge{background:rgba(0,0,0,.12);border-radius:20px;padding:0 6px;font-size:10px;font-weight:800}
  .subtab.on .badge{background:rgba(255,255,255,.25)}

  .grid{display:grid;gap:14px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}

  .card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px 16px 14px;position:relative;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .card .rail{position:absolute;left:0;top:0;bottom:0;width:5px}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .glyph{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .eyebrow{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
  .vbadge{margin-left:auto;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;font-family:'JetBrains Mono';letter-spacing:.03em}
  .vhigh{background:#FDECEA;color:#C0392B}.vmed{background:#FDF3DA;color:#B9791B}.vlow{background:#EFEDE7;color:#8A8175}
  .card h3{font-family:'Fraunces';font-size:16px;font-weight:600;margin:0 0 7px;line-height:1.28}
  .card p.detail{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 10px}
  .playbox{background:var(--brand-light);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:12.5px;line-height:1.45}
  .playbox .plabel{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:700;display:block;margin-bottom:3px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
  .chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--cream-deep);color:var(--ink-soft)}
  .chip.brand{background:var(--brand-light);color:var(--brand)}
  .chip.plat{background:var(--accent-pale);color:var(--accent-deep)}
  .srcchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .src{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink-soft);background:var(--cream);border:1px solid var(--border);padding:2px 7px;border-radius:6px;text-decoration:none}
  .src:hover{border-color:var(--brand);color:var(--brand)}
  .dropbtn{margin-left:auto;background:var(--accent-soft);color:var(--brand-deep);border:1.5px solid var(--brand-deep);font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:20px;cursor:pointer;font-family:'Quicksand';box-shadow:2px 2px 0 var(--brand-deep)}
  .dropbtn:hover{transform:translate(-1px,-1px)}
  .brief-link{display:flex;align-items:center;gap:6px;background:var(--accent-pale);border:1px solid var(--accent-deep);color:var(--brand-deep);border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer;margin-top:10px;font-family:'Nunito';text-align:left;line-height:1.35;width:100%}
  .brief-link:hover{background:var(--accent-soft)}
  .brief-link .bl-arrow{font-family:'JetBrains Mono';flex-shrink:0}
  .pips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .pip{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.01em;display:inline-flex;align-items:center;gap:3px}
  .read-hint{background:var(--brand-light);border:1px solid #DBCEF4;border-radius:13px;padding:11px 15px;font-size:12px;line-height:1.55;color:var(--ink-soft);margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
  .read-hint b{color:var(--brand);font-weight:800}
  .read-hint .rh-ico{font-size:15px;flex-shrink:0;line-height:1.3}
  .rh-list{margin:6px 0 0;padding-left:17px}
  .rh-list li{margin:3px 0;line-height:1.45}
  .drove-wrap{margin-top:11px;padding-top:11px;border-top:1px dashed var(--border)}
  .drove-lbl{display:block;font-family:'JetBrains Mono';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;margin-bottom:7px}
  .drove-chips{display:flex;flex-direction:column;gap:6px}
  .drove-chip{text-align:left;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.35;color:var(--ink);font-family:'Nunito';cursor:pointer;transition:.12s;font-weight:600}
  .drove-chip:hover{border-color:var(--brand);background:var(--brand-light);color:var(--brand)}
  .drove-chip.static{cursor:default;color:var(--ink-soft);font-weight:600}
  .drove-chip.static:hover{border-color:var(--border);background:var(--paper);color:var(--ink-soft)}
  .card.flash{animation:cardflash 1.7s ease-out}
  @keyframes cardflash{0%{box-shadow:0 0 0 3px var(--accent)}18%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
  .step-cell{transition:background .4s ease,box-shadow .4s ease}
  .step-cell.on{box-shadow:inset 0 0 0 2px var(--accent)}
  .step-cell.you.on{box-shadow:inset 0 0 0 2px var(--accent-soft)}
  .lnow{color:var(--green);font-weight:800;white-space:nowrap}
  .ltail{color:var(--accent-deep);font-weight:800;white-space:nowrap}
  .cast-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .cast-mini{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
  .cast-mini .cem{font-size:27px;line-height:1;flex-shrink:0}
  .cast-mini .crl{font-size:9.5px;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
  .cast-mini .cnm{font-family:'Quicksand';font-weight:800;font-size:14px;line-height:1}
  .cast-mini .cln{font-family:'Fraunces';font-style:italic;font-size:11px;color:var(--ink-soft);line-height:1.35;margin-top:4px}
  @media(max-width:860px){.cast-strip{grid-template-columns:1fr 1fr}}
  .cardfoot{display:flex;align-items:flex-end;gap:8px;margin-top:11px}
  .cardfoot .srcchips{flex:1;margin-top:0}
  .ch-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .ch-right .vbadge{margin-left:0}
  .fresh-chip{font-size:8.5px;font-weight:800;padding:2px 8px;border-radius:20px;font-family:'JetBrains Mono';letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .fc-fresh{background:#E7F5EC;color:#2E8B57}
  .fc-comp{background:var(--accent-pale);color:var(--accent-deep)}
  .dir-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;font-family:'JetBrains Mono'}
  .dir-hot{background:#FDECEA;color:#C0392B}.dir-cool{background:#E7F5EC;color:#2E8B57}.dir-flat{background:#EFEDE7;color:#8A8175}

  .mom-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .mom-col{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .mom-col h4{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:7px;color:var(--brand)}
  .mom-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px;line-height:1.4}
  .mom-item:last-child{border-bottom:none}
  .mchip{font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:20px;height:fit-content;white-space:nowrap;font-family:'JetBrains Mono'}
  .mup{background:#E7F5EC;color:#2E8B57}.mdown{background:#FDF3DA;color:#B9791B}

  /* Hero band */
  .ride-hero{background:linear-gradient(120deg,var(--brand-deep),var(--brand) 62%,var(--brand-mid));color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
  .ride-count{background:var(--accent);color:var(--brand-deep);font-family:'Quicksand';font-weight:900;font-size:15px;padding:8px 15px;border-radius:30px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .ride-hero h2{font-size:20px;margin:0 0 3px;font-weight:900}
  .ride-hero p{margin:0;font-size:12.5px;color:#E4DBF7}
  .ride-meta{margin-left:auto;text-align:right;font-size:11px;color:#CFC2EE;font-family:'JetBrains Mono'}

  .pillar-head{display:flex;align-items:center;gap:9px;margin:22px 0 12px}
  .pillar-sw{width:16px;height:16px;border-radius:6px}
  .pillar-head h3{font-size:18px;font-weight:800;margin:0;color:var(--brand)}
  .pillar-head .ct{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono';margin-left:auto}

  .brief{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column}
  .brief:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .brief .rail{position:absolute;left:0;top:0;bottom:0;width:5px}
  .brief-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .conv{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;font-family:'JetBrains Mono';cursor:help;position:relative}
  .cHIGH{background:#E7F5EC;color:#2E8B57}.cMEDIUM{background:#FDF3DA;color:#B9791B}.cWATCH{background:#EFEDE7;color:#8A8175}
  .brief h4{font-family:'Fraunces';font-size:14px;font-weight:600;line-height:1.32;margin:0 0 11px;flex:1}
  .brief-bottom{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .nobaby{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:#E5F6FA;color:var(--teal);font-family:'JetBrains Mono'}
  .anchor-tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--accent-pale);color:var(--accent-deep);font-family:'JetBrains Mono'}
  .tip{position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px;border-radius:10px;font-size:11px;font-weight:600;width:214px;z-index:40;box-shadow:var(--shadow-lg);font-family:'Nunito';line-height:1.5;display:none}
  .conv:hover .tip{display:block}
  .tip b{color:var(--accent)}

  /* Casting meter */
  .meter-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .meter-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .meter-top h3{font-size:16px;margin:0;color:var(--brand)}
  .meter-bar{height:26px;border-radius:14px;background:var(--cream-deep);overflow:hidden;display:flex;margin:12px 0 8px;border:1px solid var(--border)}
  .meter-fill{background:linear-gradient(90deg,var(--teal),#3bbcd8);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11px;font-weight:800;color:#fff;font-family:'JetBrains Mono'}
  .meter-rest{flex:1;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:700;color:var(--ink-soft);font-family:'JetBrains Mono'}
  .meter-legend{display:flex;gap:18px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap}
  .meter-legend b{color:var(--ink)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(28,20,48,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal{background:var(--cream);border-radius:22px;max-width:680px;width:100%;box-shadow:var(--shadow-lg);position:relative;margin-bottom:40px;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .modal-hero{background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff;padding:24px 28px;border-radius:22px 22px 0 0;position:relative}
  .x{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.16);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1}
  .x:hover{background:rgba(255,255,255,.3)}
  .modal-body{padding:22px 28px 28px}
  .m-sec{margin-bottom:20px}
  .m-sec-label{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  /* Monday Memo — signal cards (visual pass 2026-08-17) */
  .sig{display:flex;gap:13px;align-items:flex-start;background:var(--paper);border:1px solid var(--border);
       border-left:4px solid var(--sig,var(--brand));border-radius:13px;padding:13px 15px;margin-bottom:10px;
       opacity:0;transform:translateY(10px);animation:sigIn .5s cubic-bezier(.2,.7,.3,1) forwards;
       transition:box-shadow .2s ease,transform .2s ease}
  .sig:not([style*='block']):hover{box-shadow:0 6px 18px rgba(37,41,31,.09);transform:translateY(-2px)}
  @keyframes sigIn{to{opacity:1;transform:none}}
  .sig-badge{width:42px;height:42px;min-width:42px;border-radius:12px;display:flex;align-items:center;
             justify-content:center;font-size:21px;background:var(--sigbg,var(--brand-light))}
  .sig-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .sig-kind{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.11em;font-weight:800;
            color:var(--sig,var(--brand));background:var(--sigbg,var(--brand-light));padding:3px 7px;border-radius:20px}
  .sig-live{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.08em;font-weight:800;color:var(--coral)}
  .sig-live i{font-style:normal;animation:sigPulse 1.6s ease-in-out infinite;display:inline-block}
  @keyframes sigPulse{0%,100%{opacity:1}50%{opacity:.25}}
  .sig-stat{margin-left:auto;text-align:right;line-height:1}
  .sig-stat b{display:block;font-family:'Quicksand';font-weight:900;font-size:22px;color:var(--sig,var(--brand));letter-spacing:-.01em}
  .sig-stat span{display:block;font-family:'JetBrains Mono';font-size:8px;letter-spacing:.06em;color:var(--ink-soft);margin-top:3px}
  .sig-h{font-weight:800;font-size:13.5px;line-height:1.32;margin-bottom:3px}
  .sig-d{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
  @media (prefers-reduced-motion:reduce){
    .sig{opacity:1;transform:none;animation:none}
    .sig:hover{transform:none}
    .sig-live i{animation:none}
  }

  {name:"Full Circle (For Good)", dir:"hot", note:"Still the closest head-to-head — a near-identical compostable cling wrap and zipper bag range with a built-in slide cutter. Cites ASTM D-6400, an INDUSTRIAL composting standard, alongside home-composting messaging, and also uses PBAT. With the FDA proposing mandatory notification for food-contact substances, the era of loosely-evidenced claims about what touches food is narrowing for everyone.", lesson:"Never attack them. The difference is HOME certification (DIN CERTCO, ~12–24 weeks) and a willingness to say which bin — let the shopper run the comparison."},
  {name:"Stasher (SC Johnson)", dir:"warm", note:"The back-to-school push has run its course for this cycle — the Complete School Lunch Kit and the 30%-off sale have both closed. The structural position is unchanged: silicone and recyclable kraft paper, big distribution, and an end-of-life story that depends on either reuse or a paper stream that accepts it. Owned by SC Johnson, which also owns Ziploc.", lesson:"Do not chase their promotional calendar. The cooler and the produce drawer are occasions they are not built for."},
  {name:"Amazon-native compostable wraps", dir:"warm", note:"Bestselling third-party compostable wraps continue to lead with a slide cutter and ‘ASTM D-6400 certified’ — an industrial standard — while positioning for home kitchens. Cheap, well-reviewed, and cert-ambiguous in the way that erodes trust in the whole category.", lesson:"The category’s real enemy is cert confusion, not any single rival. Own the explainer and you own the shelf conversation."},
  {name:"Ziploc / Glad (the incumbents)", dir:"warm", note:"Still the default drawer and the volume. Note the widely-shared ‘Ziploc microplastics lawsuit’ was DISMISSED in 2025 — never run that framing; SC Johnson’s live exposure is PFAS litigation in discovery. Their real vulnerability is what the film is and what happens to it afterwards.", lesson:"Attack the material, never the customer who owns a box of it. Cling is the villain; the shopper is always the hero."},
  {name:"Bee’s Wrap", dir:"warm", note:"The adjacent reusable — organic cotton with plant wax and tree resin, now including a vegan line. Loyal following, genuinely low-waste, but it is a different behaviour: wash it, store it, remember it. It does not go over a bowl of curry and it does not go in a cooler.", lesson:"Not a rival so much as a neighbour. Never disparage a reusable — the honest line is that they solve a different half of the drawer."},
  {name:"Great Wrap", dir:"cold", note:"The cautionary tale worth remembering internally: the Australian compostable-wrap venture collapsed in Sept 2025 carrying roughly A$39M of debt, having raised closer to A$28M. Ambition outran both the unit economics and the film’s performance.", lesson:"Internal only — never post about a competitor failing. It is the reminder that the product has to actually work, which is why the tests matter more than the manifesto."},
];

const BRIEFS = [
  {id:"GS-0817-1", amp:{headline:"The loophole, explained properly — including the parts that weaken it", why:"A genuinely newsworthy rule in the brand’s exact category, and almost nobody will explain it accurately. Authority content that stays true for years, bought cheaply while the story is warm.", budget:130, window:"Aug 19 – Aug 26", objective:"Saves + profile visits — an authority buy, not a conversion buy", guardrail:"Never say the FDA ‘banned’ anything or that this is law. Never imply Compostic is required, approved or endorsed by the rule. Never suggest specific products are unsafe. Auto-pause if comments turn conspiratorial — this is explanation, not alarm.", placements:[{platform:"Instagram", format:"Reel + saveable carousel", budget:75, reach:"Warm + low-tox lookalikes", audience:"Clean-home, food-policy curious, label readers", note:"Nuance survives here — lead with the carousel for saves."},{platform:"TikTok", format:"In-feed Spark Ad", budget:55, reach:"Cold reach", audience:"News-adjacent + kitchen-swap interests", note:"‘they didn’t have to tell anyone’ is the hook that travels."}]}, pillar:"GS", dna:"wormsley-bit", plat:"IG + TikTok", anchor:true, world:true, proof:true, panelTags:["proof","character","funny"], concept:"A company can currently decide in-house that a substance touching your food is safe, and tell no one. The FDA proposed changing that on Aug 10 — and it covers food-contact materials. Wormsley explains it accurately, caveats and all.", hooks:["a company can decide by itself that something touching your food is fine. and tell nobody.","the FDA just proposed closing a door most people didn’t know was open","‘generally recognised as safe’ — recognised by whom, exactly?"], rec:0, caption:"here is a thing that is true today 🪱 if a company adds a new substance to food — including materials that TOUCH food — it can convene its own experts, conclude the substance is generally recognised as safe, and never tell the FDA. that is the actual system. on august 10 the FDA proposed changing it, so that notifying the agency becomes mandatory rather than optional. now the caveats, because we would rather you heard them from us: this is a PROPOSAL, not law. it requires notification, not approval — companies can keep selling while the paperwork moves. comments close december 9 and nothing is final before 2027. we are a wrap brand with a petroleum-based component in our film that we tell you about unprompted, and a home-compostable certification from DIN CERTCO you can go and look up. we did not need a rule to make us say it. but we are quite pleased one is coming.", lead:{ch:"TikTok",who:"reach — ‘they didn’t have to tell anyone’ is genuinely surprising, and surprise travels further than outrage"}, shoot:{setup:"Wormsley at a small desk with printed pages of the proposal and reading glasses, deliberately calm. Cut between the plain-language explanation and highlighted lines of actual text. Kitchen-adjacent set, warm light — this must not look like a news channel.", cast:"Wormsley + printed pages + reading glasses + the pack for the final beat", tips:"Do NOT say banned, illegal, or unsafe. Do NOT name a brand or product. Give the three caveats equal screen time to the headline — that is the entire point of the brief. Never say ‘plastic-free.’ Precision is the moat."}, edit:{hook:"‘generally recognised as safe.’ beat. ‘…by who?’", pace:"Deadpan, unhurried, let the pauses land the surprise.", captions:"Clean and quotable; highlight the caveats in a second colour so they read as equally important.", audio:"Dry original VO. No trending sound and no tension music — the calm IS the differentiator.", overlays:"‘proposal, not law’ / ‘notification, not approval’ / ‘comments close Dec 9’", length:"28–35s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Static medium on Wormsley at the desk, pages in hand. He looks up over the glasses. No title card, no music — cold open on the sentence.",txt:"‘generally recognised as safe’"},{t:"5–13s",dofilm:"Insert: finger traces a highlighted line about food-contact substances on the printed page. Hold long enough to actually read it.",txt:"including things that TOUCH food"},{t:"13–20s",dofilm:"Back to the desk. He sets the pages down and delivers the three caveats, counting them on the page with a pen. One tick per caveat.",txt:"proposal · notification · Dec 9"},{t:"20–28s",dofilm:"Cut to the pack on the counter, label forward. Hand turns it to show the ingredient line and the cert mark, unhurried, one take.",txt:"we say ours anyway"},{t:"28–34s",dofilm:"Wide, static, Wormsley back in frame beside the pack. Small shrug. Cut on the shrug, not on a joke.",txt:"didn’t need a rule to."}], channels:[{k:"tt",who:"reach / new eyes",cut:"Lead cut — the surprise, then the correction, then the shrug."},{k:"ig",who:"voice home + authority",cut:"Reel plus a saveable carousel: what the rule does, what it does not do, when it happens."}], test:{hyp:"An accurate explainer of a rule in the brand’s own category — with the weakening caveats stated as loudly as the headline — outperforms claim-led content on saves and converts to follows rather than immediate sales.",metric:"Profile visits + saves >2× owned average in 72h; watch comments for ‘finally someone explained it properly.’"}, amplify:"Boost while the story is warm, then let it live as evergreen authority. Retarget engagers with the date-label decoder.", ladder:true, drove:["FDA proposed mandatory GRAS notification Aug 10, 2026","the proposal explicitly covers food-contact substances","the brand already discloses its own composition unprompted"], why:"The most authoritative post available this week and it costs nothing but accuracy. In a category where trust is the currency, a brand that volunteers the caveats weakening its own best headline becomes the one people believe about everything else."},
  {id:"RC-0817-1", amp:{headline:"The date-label decoder — the most useful thing the brand can publish this month", why:"Genuinely useful, endlessly saveable, and it converts read-the-label instinct into a household money argument. Evergreen once made.", budget:120, window:"Aug 20 – Aug 27", objective:"Saves + link taps", guardrail:"Never tell anyone a specific food is safe to eat past a date. Frame as what the labels MEAN, and defer to judgement on anything safety-related. Auto-pause if comments read as food-safety advice-seeking.", placements:[{platform:"Instagram", format:"Carousel + Reel", budget:80, reach:"Warm + food-waste interests", audience:"Home cooks, budget-conscious households, low-tox", note:"Carousel is the asset — built to be saved and re-shared."},{platform:"TikTok", format:"In-feed", budget:40, reach:"Cold", audience:"Kitchen tips + money-saving interests", note:"‘you’ve been reading it wrong’ is the hook."}]}, pillar:"RC", dna:"compost-reveal", plat:"IG + TikTok", anchor:false, world:true, proof:true, panelTags:["proof","swap"], concept:"‘BEST if used by’ is about quality. ‘USE by’ is about safety. Only about half of people know the difference, and it drives roughly a tenth of all food waste. California just banned ‘sell by’ entirely.", hooks:["‘best if used by’ and ‘use by’ mean different things. most people bin food over it.","california just banned the most confusing date on your food","you are probably throwing away food that is completely fine"], rec:0, caption:"the label on your food is doing a worse job than you think 🧾 ‘BEST if used by’ is about QUALITY — the maker reckons it is at its best until then. ‘USE by’ is about SAFETY, and that one you take seriously. and ‘sell by’ was never for you at all — it was stock rotation for the shop, which is exactly why california banned it from consumer packaging as of july 1. why it matters: 88% of people bin food at or near the date, only about half can correctly say what the phrases mean, and close to a tenth of all the food wasted in this country traces back to that confusion. so before the bin: check WHICH label. use your judgement on anything that smells or looks off — no label beats your own senses. and cover things properly in the first place, because most of what gets thrown out was simply left uncovered a day too long. 🪱", lead:{ch:"Instagram",who:"voice home — a genuinely useful explainer is what this audience saves and sends on"}, shoot:{setup:"Real packaging on a counter, shot flat and clean. Physically separate two piles: QUALITY labels versus SAFETY labels, using actual products. Then a third pile for ‘sell by’ pushed out of frame entirely. The sorting IS the explainer.", cast:"Hands + real packaged food + a marker + two card labels", tips:"Never advise that a specific food is safe past its date — always defer to senses and judgement. Keep the tone useful and money-first, never green. Never say ‘plastic-free.’ The wrap appears at the end as the follow-through, not the subject."}, edit:{hook:"Two packets held up. ‘these two dates mean completely different things.’", pace:"Calm, sorting rhythm, genuinely instructional.", captions:"The two phrases held on screen throughout in contrasting colours.", audio:"Quiet original VO — credibility over reach on this one.", overlays:"‘BEST if used by = quality’ / ‘USE by = safety’ / ‘sell by = not for you’", length:"25–35s", aspect:"9:16 + 5-card carousel"}, scenes:[{t:"0–5s",dofilm:"Two real packets held side by side to camera, dates visible. Slight push-in. No music yet.",txt:"these mean different things"},{t:"5–13s",dofilm:"Overhead: packets sorted left into a QUALITY pile as the phrase is said. Hand places a written card at the top of the pile.",txt:"BEST if used by = quality"},{t:"13–20s",dofilm:"Same overhead, right-hand SAFETY pile builds. Card placed. The physical sorting makes the distinction stick.",txt:"USE by = safety"},{t:"20–26s",dofilm:"A ‘sell by’ packet is slid deliberately out of frame entirely. Small beat of comedy in the dismissal.",txt:"sell by = never was for you"},{t:"26–33s",dofilm:"Cut to the fridge: a half-used vegetable being covered properly and put back. Quiet, practical, no card.",txt:"and cover it before it’s a question"}], channels:[{k:"ig",who:"voice home + saves",cut:"Lead cut — Reel plus the 5-card carousel, which is the actual long-life asset."},{k:"tt",who:"reach",cut:"Faster sort; ‘you’ve been reading it wrong’ opens it."}], test:{hyp:"A genuinely useful label explainer outperforms product-led content on saves and shares, and drives higher-intent traffic because it establishes the brand as practically useful before it sells anything.",metric:"Saves >2.5× owned average; measure assisted conversions from savers over 14 days."}, amplify:"Boost to food-waste, budgeting and home-cook audiences. This is the asset to keep alive year-round.", ladder:true, drove:["California banned consumer-facing ‘sell by’ dates from Jul 1, 2026","only 53% of consumers correctly identify what date labels mean","roughly a tenth of US food waste traces to date-label confusion"], why:"Takes the brand’s single most recognisable instinct — read the label — and points it at a label that costs households money every week. Useful before it is commercial, which is the only way this brand earns the right to sell anything."},
  {id:"FG-0817-2", pillar:"FG", dna:"health-swap", plat:"IG + TikTok", anchor:false, world:false, proof:true, panelTags:["proof","swap","health"], concept:"Fresh produce is 45.4% of everything America throws away — the single biggest category. Not leftovers in the abstract: the half-cucumber, the herbs, the berries. The product finally has a named job.", hooks:["fresh produce is 45.4% of everything america throws out. that’s the whole category.","the most wasted food in the country is the stuff you felt good about buying","you didn’t waste leftovers. you wasted vegetables."], rec:1, caption:"the most wasted food in america is not takeaway or leftovers 🥬 it is fresh produce — 45.4% of all surplus food, the single biggest category. which is a particularly annoying statistic, because produce is the stuff you felt virtuous buying. the herbs that went slimy. the half cucumber. the berries that turned on day three. the half a cabbage from the recipe that needed a quarter. the good news, genuinely: ReFED’s 2026 report logged the first national drop in food waste since the pandemic, and households drove it. the mechanism is mostly unglamorous — buy a bit better, store it a bit better. that is it. we make a wrap. we are obviously not neutral here. but the honest version is that covering things properly is one of about four things that actually moves this, and it is the easiest of the four. 🪱", lead:{ch:"Instagram",who:"voice home — the money-and-effort framing lands with the people already buying the produce"}, shoot:{setup:"A real fridge audit of produce specifically. Line up the actual offenders on a board — herbs, half cucumber, berries, half cabbage — and shoot them flat, honestly, slightly sad. Then cover each one properly and return them. Warm daylight, no styling.", cast:"Hands + genuinely half-used produce + the roll", tips:"No guilt, no lecture, no planet language — this is a money and effort argument. Acknowledge the brand is not neutral; that admission is what makes the rest credible. Never claim the wrap prevents spoilage entirely. Never say ‘plastic-free.’"}, edit:{hook:"The sad line-up of half-used produce, shot flat.", pace:"Honest, brisk, quietly satisfying at the turn.", captions:"The stat once, early, then out of the way.", audio:"Warm original VO, light bed.", overlays:"‘45.4% of US surplus food’ then the four offenders named.", length:"20–28s", aspect:"9:16 + carousel"}, scenes:[{t:"0–5s",dofilm:"Overhead on a board: slimy herbs, a half cucumber, soft berries, a half cabbage. Laid out like evidence. Hold, unflattering.",txt:"the most wasted food in america"},{t:"5–11s",dofilm:"Hand places a plain written card beside them with the figure on it. No motion graphic — handwriting reads more honest.",txt:"45.4% · fresh produce"},{t:"11–19s",dofilm:"Each item covered properly in turn, cut on each one so it builds a rhythm. Tight, practical, hands only.",txt:"cover it properly"},{t:"19–25s",dofilm:"Back into the fridge, arranged so they are visible rather than buried at the back. That placement is half the actual fix.",txt:"and put it where you’ll see it"},{t:"25–28s",dofilm:"Fridge door closes. Wormsley on the counter, unbothered. No claim card.",txt:"boring. works."}], channels:[{k:"ig",who:"voice home + saves",cut:"Lead cut — the audit; carousel of the four worst offenders and how to store each."},{k:"tt",who:"reach",cut:"Faster; the 45.4% stat is the hook and the produce line-up is the visual."}], test:{hyp:"Naming fresh produce specifically — rather than ‘leftovers’ — converts better because it matches what people know they personally waste, and reframes the purchase as money rather than virtue.",metric:"Saves and comments naming their own worst offender; link taps vs previous general food-waste posts."}, amplify:"Boost into home-cooking, budgeting and grocery-haul audiences. Retarget savers with the date-label decoder.", ladder:true, drove:["fresh produce is 45.4% of all US surplus food (ReFED, 2026)","US surplus food fell for the first time since the pandemic, household-led","fibre-forward cooking is putting more produce into fridges"], why:"Gives the product a specific, named job instead of a vague one. ‘Leftovers’ is abstract; the half cucumber is in everyone’s fridge right now, and it turns an environmental purchase into a household one."},
  {id:"FG-0817-1", pillar:"FG", dna:"health-swap", plat:"IG + TikTok", anchor:false, world:true, panelTags:["health","proof"], concept:"The surprise under the GRAS news: the things that touch your food have had a self-declaration route too. Stated calmly, with no villain and no claim about harm.", hooks:["the surprising bit isn’t the chemicals. it’s who decided they were fine.","‘who checked this?’ turns out to be a genuinely open question","not a scandal. just a gap. and it’s being closed."], rec:0, caption:"the reaction to this week’s news has been less outrage and more genuine surprise 🥪 the thing people did not know: the route that lets a company conclude a substance is safe without telling the regulator also covers substances that TOUCH food. packaging, films, coatings. we are not going to tell you that anything on your shelf is harmful, because we do not know that and neither does anyone posting confidently about it. what we will say is narrower and duller: ‘who checked this?’ turned out to be a more open question than most people assumed, the FDA has proposed closing it, and in the meantime the only real defence a shopper has is a brand that volunteers its own composition. ours: a plant-based biopolymer, PLA, and PBAT — which is petroleum-based, and which we would have to tell you about either way because we already do. certified home-compostable by DIN CERTCO, roughly 12–24 weeks in a home bin.", lead:{ch:"Instagram",who:"voice home — a nuanced trust message needs the audience that already reads the captions"}, shoot:{setup:"Calm and plain. Start on an ordinary kitchen shelf of packaged things — deliberately unremarkable, no villain packaging. Then the brand’s own pack, turned to show composition. The contrast is disclosure versus silence, not good versus evil.", cast:"Hands + ordinary packaged goods + the Compostic pack", tips:"Make NO health claim about any material, including competitors’. Do not imply anything on a shelf is dangerous. Blur or avoid recognisable rival branding. Disclose PBAT as petroleum-based — that disclosure is the point of the brief. Never say ‘plastic-free.’"}, edit:{hook:"An ordinary shelf. ‘who decided all of this was fine?’", pace:"Calm, curious, entirely unsensational.", captions:"Plain; the question held on screen longer than the answer.", audio:"Quiet original VO, no tension design.", overlays:"‘not a claim about harm’ / ‘a question about who checks’", length:"22–30s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Slow pan across an ordinary kitchen shelf of packaged food. Nothing sinister, deliberately mundane. The question appears over it.",txt:"who decided this was fine?"},{t:"5–12s",dofilm:"Insert of a hand turning one anonymous package over, looking for information that is not there. Blur any recognisable brand.",txt:"often: the company selling it"},{t:"12–18s",dofilm:"Cut to the Compostic pack. Hand turns it and holds on the composition line, including the petroleum-based component.",txt:"PLA · plant biopolymer · PBAT (petroleum-based)"},{t:"18–25s",dofilm:"Tight on the DIN CERTCO cert mark, held steady for a full two seconds so it is genuinely legible.",txt:"home-compostable · ~12–24 weeks"},{t:"25–30s",dofilm:"Pull wide, pack on the counter, Wormsley beside it. No sting, no card, just a beat of quiet.",txt:"we tell you either way"}], channels:[{k:"ig",who:"voice home + trust",cut:"Lead cut — the calm version; pair with the GRAS explainer as a two-part story."},{k:"tt",who:"reach",cut:"‘who checked this?’ as a cold hook for a sceptical audience."}], test:{hyp:"Entering a regulatory story through curiosity rather than alarm, and answering it with voluntary self-disclosure, builds more trust than a fear-led framing and avoids the backlash fear invites.",metric:"Comment sentiment (curious vs conspiratorial); saves; whether the disclosure gets quoted approvingly."}, amplify:"Boost to sceptics and comparison shoppers — this converts the people actively trying to catch the category out.", ladder:true, drove:["the FDA’s GRAS proposal explicitly covers food-contact substances","the FDA finalised a post-market assessment process for food chemicals in May 2026","the brand’s standing PBAT disclosure predates any requirement"], why:"Turns a regulatory story into a trust story without a single claim about harm. The brand’s answer to ‘who checked this?’ is simply to have already published the answer — which is a position no competitor can adopt retroactively."},
  {id:"GS-0817-2", pillar:"GS", dna:"plastic-villain", plat:"TikTok + IG", anchor:false, world:false, panelTags:["funny","character","swap"], concept:"Everything in the fridge has a date on it. Cling does not. He has no best-before, no use-by, and no plans. The date-label bit, told as a character flaw.", hooks:["everything in this fridge has a date on it except him.","Cling has no best before. that’s not a flex, Cling.","the only thing in here with no expiry is the plastic"], rec:0, caption:"fridge audit, and one of these is not like the others 🎈 the yoghurt has a date. the milk has a date. the leftovers have a date we wrote on with a marker like responsible adults. Cling has no date at all. no best-before, no use-by, no plans, no intention of ever going anywhere. he thinks this makes him the most reliable thing in the fridge. it makes him the only thing in here that will outlive the fridge. our wrap does have an ending — home-compostable, certified by DIN CERTCO, roughly 12–24 weeks in a home bin once you are done with it. having an ending is the feature. 🪱", lead:{ch:"TikTok",who:"reach — character comedy carries the date-label idea further than an explainer can"}, shoot:{setup:"A real fridge audit, item by item, each one turned to show its date. Rhythm builds. Then Cling (balloon / 2D puppet) pulled out with no date anywhere on him — check him twice, turn him over, nothing. The absence is the punchline.", cast:"Cling + Wormsley + a real fridge + dated groceries", tips:"The villain is the material, never the person who owns it. Never imply a rival brand. Do not make a safety claim about plastic. Never say ‘plastic-free.’ Keep the compost lane, never the toilet lane."}, edit:{hook:"Item, date. Item, date. Item, date. Then Cling.", pace:"Fast rhythmic build, then a long comic pause on the absence.", captions:"Dates called out one per item.", audio:"TikTok: a rhythmic trending sound (pull live) · IG: original audio.", overlays:"Each date shown; then ‘no date. ever.’", length:"15–20s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Three quick inserts: yoghurt, milk, marker-labelled leftovers. Each turned to camera to show its date. Cut tight on the beat.",txt:"date · date · date"},{t:"5–10s",dofilm:"Hand pulls Cling out of the fridge. Turns him over looking for a date. Turns him again. Nothing. Hold on the searching.",txt:"…nothing?"},{t:"10–15s",dofilm:"Cling preens, delighted with himself, entirely misreading the room. Wormsley watches from the counter, unimpressed.",txt:"‘i never expire, babe’"},{t:"15–19s",dofilm:"Cut to the roll. Hand sets it down beside the compost bin. Simple, quiet, no flourish.",txt:"ours has an ending"},{t:"19–22s",dofilm:"End card on cream: the cert line, navy type, static.",txt:"~12–24 weeks · DIN CERTCO home"}], channels:[{k:"tt",who:"reach / new eyes",cut:"Lead cut — rhythmic date build, comic absence, quick payoff."},{k:"ig",who:"voice home",cut:"Warmer cut; pair with the date-label decoder as the useful follow-up."}], test:{hyp:"Attaching the villain character to the week’s date-label idea makes an educational point travel as comedy, and outperforms the explainer alone on shares.",metric:"Shares and non-follower reach vs the date-label decoder; comment references to Cling."}, amplify:"Cheap cold boost on TikTok if organic reach clears the average in 24h.", ladder:false, drove:["California’s date-label standardisation put ‘best before’ into the culture","the product’s defining property is that it has an end-of-life at all"], why:"Converts the week’s most useful idea into its most shareable one. Having an ending is the product’s entire mechanism, and framing permanence as a personality flaw is the only way this brand ever makes that point."},
  {id:"RC-0817-2", pillar:"RC", dna:"torture-test", plat:"TikTok + IG", anchor:false, world:false, proof:true, panelTags:["proof","swap"], concept:"THE PRODUCE TEST: half a cucumber, a bunch of herbs and a punnet of berries — covered versus uncovered, photographed the same way every day for five days. The most-wasted category, tested honestly.", hooks:["half a cucumber, covered and uncovered. five days. same camera every day.","testing the thing we actually sell, on the food people actually waste","day five. one of these is still fine."], rec:0, caption:"we tested the boring claim 🧾 fresh produce is the most wasted food in the country, so we took the three worst offenders in our own fridge — half a cucumber, a bunch of herbs, a punnet of berries — and split each one. half covered with Compostic, half left as most people actually leave it. same shelf, same fridge, photographed from the same spot every day for five days. no restaging, no swapping in a fresher cucumber on day four, and the results including the unflattering ones are all in the video. we would love to tell you a wrap makes produce immortal. it does not. it buys you days, and days are the difference between eating it and binning it. 🪱", lead:{ch:"TikTok",who:"reach — a real five-day test answers the practical question that decides the purchase"}, shoot:{setup:"A genuine five-day test with fixed camera marks. Tape a phone position so every daily frame matches exactly — the identical framing is what makes the comparison credible. Split each item, cover one half, label both with the day. Shoot day 1 through day 5 at the same time each day.", cast:"Hands + real produce + labels + a fixed camera mark", tips:"Do not restage or substitute fresher produce. Report the result honestly including any item where the difference is marginal. Never claim the wrap prevents spoilage or extends life by a specific number of days unless the test actually shows it. Never say ‘plastic-free.’"}, edit:{hook:"Two halves of one cucumber, side by side, day one.", pace:"Time-lapse rhythm, one beat per day, tension building to day five.", captions:"Day counter locked in the same corner throughout.", audio:"Original audio + a simple ticking bed; drop it out on the day-five reveal.", overlays:"‘covered / uncovered’ labels held constant; day counter.", length:"20–28s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Overhead, fixed mark: one cucumber cut in half. One half covered with Compostic, one left bare. Both labelled. Shelf behind identical.",txt:"day 1"},{t:"5–11s",dofilm:"Same exact frame, days 2 and 3 cut together. Nothing moves but the produce. The fixed framing is doing the persuading.",txt:"day 2 · day 3"},{t:"11–17s",dofilm:"Day 4. The difference starts showing on the uncovered half. Push in slightly for the first time in the video.",txt:"day 4"},{t:"17–23s",dofilm:"Day 5, full reveal, both halves lifted into hand for a close look. Show the covered one honestly too — including any softening.",txt:"day 5"},{t:"23–28s",dofilm:"Quick cuts of the herbs and berries results, same treatment. Then Wormsley judging. Honest verdict card last.",txt:"buys days. not immortality."}], channels:[{k:"tt",who:"reach / new eyes",cut:"Lead cut — the five-day test with the honest verdict."},{k:"ig",who:"voice home + saves",cut:"Same test plus a carousel on how to store each of the three properly."}], test:{hyp:"Testing the product against the single most-wasted food category, with visible honest results, converts better than any general performance claim.",metric:">2× owned average on saves and shares; watch for comments asking about other produce — that is the series signal."}, amplify:"Organic first to read the honest result, then boost into home-cooking and food-waste interests.", ladder:true, drove:["fresh produce is 45.4% of US surplus food","fibre-forward cooking is putting more produce in fridges","‘does it actually keep things fresher’ is the practical purchase objection"], why:"Points the brand’s proof machinery at the exact category the data says people waste most. It answers the practical objection with visible evidence, and admitting the limit — days, not immortality — is what makes the result believable."},
  {id:"GS-0817-3", pillar:"GS", dna:"good-sht-bulletin", plat:"IG + TikTok", anchor:false, world:true, panelTags:["funny","character"], concept:"THE GOOD SH*T BULLETIN — the paperwork edition. The FDA moving on self-declared safety, California killing the ‘sell by’ date, and American food waste actually falling. Three genuinely good beats.", hooks:["THE GOOD SH*T BULLETIN: the paperwork edition.","three things got quietly better and nobody made a graphic about it","your periodic reminder that some things are, in fact, improving"], rec:0, caption:"THE GOOD SH*T BULLETIN 📰 the paperwork edition, which is a less exciting sentence than it deserves. one: the FDA proposed that companies must actually TELL them when they decide something added to food is safe — including materials that touch food. proposal, not law, comments close december 9, but it is movement in the right direction. two: california banned the consumer-facing ‘sell by’ date from july 1 and standardised the rest, because roughly a tenth of all food waste came from people misreading them. three: american food waste actually FELL — the first drop since the pandemic, and households did most of it. none of this is finished. all of it is the boring administrative kind of progress that never trends. we are contractually obliged to be cheerful about this. we also genuinely are. 🪱", lead:{ch:"Instagram",who:"voice home — the Bulletin is a recurring community ritual and rituals belong where the community is"}, shoot:{setup:"The established Bulletin format, unchanged: Wormsley at the tiny news desk, three headline cards, one per beat. Keep the set, the bell and the framing identical to every previous edition — recognisable furniture is the whole value of a recurring format.", cast:"Wormsley + three headline cards + hands", tips:"Three beats maximum and every one verifiable. State the GRAS caveat inside beat one — a Bulletin that overstates is worse than no Bulletin. Cheerful, never smug. Compost lane only."}, edit:{hook:"Desk bell. ‘THE GOOD SH*T BULLETIN.’", pace:"Snappy — three beats, three cards, out.", captions:"Headline style, one line per beat.", audio:"The established light news-sting original audio. Keep it consistent between editions.", overlays:"‘1 / 2 / 3’ counters + the ‘still not doomed’ sign-off card.", length:"22–28s", aspect:"9:16"}, scenes:[{t:"0–3s",dofilm:"Desk bell rings, title card drops in. Identical framing to every prior edition — that consistency is the format’s equity.",txt:"THE GOOD SH*T BULLETIN"},{t:"3–11s",dofilm:"Beat one card up: the GRAS proposal. He adds a small handwritten ‘proposal, not law’ note to the bottom of the card on camera.",txt:"they’d have to tell someone"},{t:"11–17s",dofilm:"Beat two card: California and the ‘sell by’ date. He crosses the phrase out with a marker in one stroke.",txt:"‘sell by’ — gone"},{t:"17–23s",dofilm:"Beat three card: US food waste fell, households led it. Small approving nod, no celebration.",txt:"first drop since the pandemic"},{t:"23–28s",dofilm:"Sign-off shrug, sign card up. Bell again to close the loop.",txt:"not finished. still moving."}], channels:[{k:"ig",who:"voice home + community ritual",cut:"Lead cut — the Bulletin plus a saveable three-card carousel of the same beats."},{k:"tt",who:"reach",cut:"Same three beats, faster, with the news-sting."}], test:{hyp:"A recurring named ritual with genuinely fresh content each edition builds return viewership better than one-off topical posts.",metric:"Returning-viewer rate versus the previous edition; saves above owned average."}, amplify:"Organic only — the Bulletin should earn its audience rather than rent one.", ladder:false, drove:["FDA proposed mandatory GRAS notification Aug 10","California’s date-label standardisation took effect Jul 1","US surplus food fell for the first time since the pandemic"], why:"The brand’s most ownable recurring format, carrying three genuinely fresh, genuinely positive beats. It is the antidote to eco-doom, and this week the news actually cooperated."},
  {id:"RC-0817-3", pillar:"RC", dna:"compost-reveal", plat:"IG + TikTok", anchor:false, world:false, proof:true, panelTags:["proof"], concept:"The compost bin as the weather turns: the honest answer to why ~12–24 weeks is a range and not a promise. Temperature, moisture and turning all move the number — so show the bin, not a claim.", hooks:["why we say 12 to 24 weeks and not a single number","the compost bin as summer ends — the honest version","our own certification is a range. here’s why."], rec:1, caption:"a question we get constantly: why do you say roughly 12 to 24 weeks instead of just giving us a number? 🧾 because a compost bin is not a laboratory. it is a box in your garden, and its temperature, moisture and how often you bother turning it all change the answer. a hot, active, well-turned bin in august is a completely different environment from a cold, forgotten one in november — and ours is about to make that transition on camera, like it does every year. certified home-compostable by DIN CERTCO, roughly 12–24 weeks in a home bin. we could quote you the fastest number and let you assume it. we would rather show you the actual bin, in actual weather, and let you calibrate. 🪱", lead:{ch:"Instagram",who:"voice home — the long-running proof series belongs with the people following the story"}, shoot:{setup:"Continue the standing series from the identical locked-off position. This episode adds the seasonal variable: show a thermometer in the compost, show the moisture, show the turning. Explain the range with the physical bin rather than a graphic.", cast:"Hands + compost bin + a compost thermometer + the marked wrap + Wormsley", tips:"Never quote a single fixed number of weeks. Never speed up or restage. Naming the variables honestly IS the brief — a brand explaining why its own claim is a range is making a trust move. Compost lane, never toilet — this touches food."}, edit:{hook:"Thermometer pushed into the compost. The reading is the hook.", pace:"Slow, documentary, genuinely explanatory.", captions:"Temperature and conditions on screen, plainly.", audio:"Natural garden sound + dry Wormsley VO.", overlays:"‘warm bin = faster · cold bin = slower’ / ‘~12–24 weeks · DIN CERTCO’", length:"20–26s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Locked-off on the bin, lid up. A compost thermometer is pushed into the heap and the reading held to camera.",txt:"why it’s a range"},{t:"5–11s",dofilm:"Hands turn the heap over with a fork — steam visible if it is genuinely active. Show the moisture, squeeze a handful.",txt:"heat · moisture · turning"},{t:"11–17s",dofilm:"Find the marked wrap square. Show its current state honestly, whatever it looks like, at the same angle as every prior episode.",txt:"week N"},{t:"17–23s",dofilm:"Two hand-written cards placed side by side on the bin lid: a warm active bin versus a cold neglected one, with the range under each.",txt:"~12–24 weeks, and why"},{t:"23–26s",dofilm:"Lid closes. Wormsley on the rim, entirely unbothered by the complexity.",txt:"DIN CERTCO home-compostable"}], channels:[{k:"ig",who:"voice home + the proof audience",cut:"Lead cut — the seasonal episode; keep the series pinned as a highlight."},{k:"tt",who:"reach",cut:"Recap cut for new eyes — ‘we’ve been burying this for months, here’s why the number moves.’"}], test:{hyp:"Explaining why the brand’s own certification is a range rather than a fixed number increases perceived honesty and reduces the ‘does it really work’ objection more than a confident single figure would.",metric:"Comment sentiment; reduction in ‘how long does it actually take’ questions in the following fortnight."}, amplify:"Organic — credibility here comes from it not looking bought.", ladder:false, drove:["‘how long does it actually take’ is the recurring question under every post","the seasonal transition makes the range concrete rather than evasive"], why:"Turns the least satisfying thing about the product — an imprecise number — into a demonstration of honesty. A competitor quoting one confident figure now looks less credible, without the brand ever mentioning them."},
  {id:"CW-0817-1", pillar:"CW", dna:"caught-in-wild", plat:"IG + TikTok", anchor:false, world:true, panelTags:["moment","swap"], concept:"The cooler is a drawer that leaves the house. College football Week 0 kicks off Aug 29, so the prep content runs now — wrap it Friday, travel it Saturday.", hooks:["the cooler is just a drawer that leaves the house","week 0 is aug 29. the wrapping happens friday night.","everything in a cooler was wrapped by someone the night before"], rec:0, caption:"season starts aug 29, which means the actual work happens the friday before 🏈 everything that comes out of a cooler was wrapped by somebody the night before — the tray, the sandwiches, the thing that has to survive a car boot and four hours of ice. a cooler is genuinely just a drawer that leaves the house, and it has the same problem: half of what goes in is half of something else. ours is certified home-compostable, DIN CERTCO, roughly 12–24 weeks in a home bin — so the wrapping that comes home in the bottom of the cooler has somewhere to go that is not the bin. wrap it friday. travel it saturday. no new system, no extra step, no speeches at a tailgate. 🪱", lead:{ch:"Instagram",who:"voice home — prep content saves, and saves are what get opened again on Friday"}, shoot:{setup:"A real Friday-night prep: tray of food, sandwiches, cut fruit, all being wrapped and packed into an actual cooler with ice. Then a short Saturday-morning beat of the cooler going into a car. Warm kitchen light for prep, hard daylight for the car.", cast:"Hands + real prep food + a cooler + ice + the roll", tips:"Prep content, not party content — the party is next week. Do not make claims about keeping food cold or safe; that is the cooler’s job, not the wrap’s. Never say ‘plastic-free.’ Keep it practical and unbranded-feeling."}, edit:{hook:"An empty cooler open on the floor. ‘right. friday night.’", pace:"Practical prep rhythm, satisfying pack, quick Saturday button.", captions:"Minimal; the pack sequence carries it.", audio:"Warm original audio; a light game-day-adjacent bed without licensing anything.", overlays:"‘wrap friday’ / ‘travel saturday’", length:"18–25s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Empty cooler open on the kitchen floor, lid back. Overhead. Food laid out on the counter above it, unwrapped and waiting.",txt:"friday night"},{t:"5–13s",dofilm:"Wrapping sequence: tray covered, sandwiches wrapped individually, cut fruit sealed. Cut on each wrap to build rhythm. Hands only.",txt:"wrap it now"},{t:"13–19s",dofilm:"Everything packed into the cooler around ice, lid down, latch closed. One satisfying push.",txt:"packed"},{t:"19–23s",dofilm:"Hard cut to daylight: cooler lifted into a car boot. Quick, no dialogue, the transition does the work.",txt:"travel saturday"},{t:"23–25s",dofilm:"End frame: the roll back in the kitchen drawer, waiting. Static, quiet.",txt:"a drawer that leaves the house"}], channels:[{k:"ig",who:"voice home + saves",cut:"Lead cut — the prep; carousel of ‘what to wrap the night before.’"},{k:"tt",who:"reach",cut:"Faster pack sequence; ‘the cooler is just a drawer that leaves the house’ opens it."}], test:{hyp:"Claiming the cooler occasion a week before kickoff reaches a large non-eco audience the brand has never addressed, and prep-format content saves better than day-of content.",metric:"% non-follower reach; saves now versus opens during Week 0 weekend."}, amplify:"Boost into game-day, tailgate and make-ahead interests through the week before kickoff, then stop.", ladder:true, drove:["college football Week 0 kicks off Aug 29","tailgate content peaks in the prep window before the season, not on match day"], why:"Claims a large, entirely non-environmental occasion the brand has never touched, and reframes the cooler as a drawer — which makes the product obviously relevant without a single sustainability argument."},
  {id:"FG-0817-3", pillar:"FG", dna:"moment-jack", plat:"TikTok + IG", anchor:false, world:false, panelTags:["funny","health","swap"], concept:"The ruling. Someone holds something up to the camera and asks the internet whether it is still good. Wormsley adjudicates. Then the actual answer: which label, and what a proper cover would have changed.", hooks:["send me a photo and i will rule on whether it’s still good","the sniff. the squint. the group chat poll. a ruling.","‘is this still good?’ — the internet’s most asked kitchen question"], rec:0, caption:"the sniff. the squint. the photo sent to the group chat with no caption. ‘is this still good?’ is the most asked question in any kitchen and nobody has ever given a satisfying answer 🥪 so: the ruling. Wormsley adjudicates, with two actual rules. one — check WHICH label. ‘best if used by’ is a quality date, ‘use by’ is a safety date, and they are not the same thing. two — your own senses beat any printed date, in both directions. no label makes something safe that smells wrong. and the quiet third rule: most of what ends up in this question was simply left uncovered a day too long. cover it properly and the question mostly stops coming up. send us yours. he is enjoying the power far too much. 🪱", lead:{ch:"TikTok",who:"reach — a question people genuinely ask is the cheapest possible entry to a new audience"}, shoot:{setup:"A judgement-format set: Wormsley behind a small bench like a tiny adjudicator, real items presented to him one at a time. Keep verdicts fast and funny, then land the two real rules plainly at the end. Invite submissions to make it recurring.", cast:"Wormsley + real fridge items + hands presenting", tips:"NEVER rule that a specific food is safe to eat — every verdict defers to the viewer’s own senses. Keep it comic on the judging and plain on the rules. This must not become food-safety advice. Never say ‘plastic-free.’"}, edit:{hook:"An item held to camera. ‘…is this still good?’", pace:"Fast comic verdicts, then a deliberate slow-down for the rules.", captions:"Verdict stamps on each item.", audio:"TikTok: a courtroom-adjacent or judgement trending sound (pull live) · IG: original.", overlays:"‘RULING’ stamps; then the two rules held on screen.", length:"15–22s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"An item thrust to camera — a slightly sad half of something. Wormsley behind the bench regards it with total seriousness.",txt:"is this still good?"},{t:"4–10s",dofilm:"Three fast verdicts on three items, one stamp each. Comic timing, no dialogue needed, cut hard on each stamp.",txt:"RULING · RULING · RULING"},{t:"10–15s",dofilm:"Pace drops. Two plain cards placed on the bench: which label, and trust your senses. Delivered straight, no bit.",txt:"quality vs safety · senses win"},{t:"15–20s",dofilm:"Cut to the actual fix — the item that started it, covered properly and returned to the fridge.",txt:"most of this was just left open"},{t:"20–22s",dofilm:"Wormsley resumes his bench, clearly enjoying the authority far too much.",txt:"send us yours"}], channels:[{k:"tt",who:"reach / participation",cut:"Lead cut — the ruling format; comments will fill with submissions."},{k:"ig",who:"voice home",cut:"Story-led with a submission sticker; recurring ruling series if it lands."}], test:{hyp:"A participation format built on a question people already ask drives comment volume and submissions far beyond benefit-led content, and creates a repeatable series with no production cost.",metric:"Comment and DM submission volume; whether a second edition can be built entirely from submissions."}, amplify:"Cheap boost into home-cooking and food-waste interests — this is a reach and participation play.", ladder:false, drove:["‘is this still good?’ is a permanent, universal kitchen question","California’s date-label standardisation gives it a live news peg","most of the question traces back to food left uncovered"], why:"Turns the week’s most useful information into a participation format the audience supplies for free. It is the cheapest recurring series available and it makes the product the answer to a question people are already asking each other."},
  {id:"GS-0817-4", pillar:"GS", dna:"wormsley-bit", plat:"IG + TikTok", anchor:false, world:true, panelTags:["funny","character","moment"], concept:"Dirt cake is back — pudding, crushed biscuit and gummy worms, now built as terrariums. A dessert made of fake soil and fake worms, reviewed by a real worm with professional standards.", hooks:["a dessert made of soil and worms is trending. i have notes.","dirt cake is back and i have been asked to review it","professionally speaking, the soil is inaccurate"], rec:0, caption:"it has been brought to our attention that dirt cake is back 🪱 pudding, crushed biscuit, gummy worms, and now apparently built as terrariums with edible flowers on top. we asked our resident expert for a professional assessment. his notes: the soil texture is broadly convincing. the worms are structurally unserious and taste, in his words, ‘like a lie.’ the drainage is non-existent. no aeration whatsoever. as a decomposition environment he rates it zero out of ten. as a dessert he declined to comment on the grounds that he is not qualified, which we think is fair. he did note, approvingly, that it is the only cake that ends up looking like where our wrap goes. we are not going to explain that further. 🪱", lead:{ch:"Instagram",who:"voice home — a pure character bit rewards the audience that already knows Wormsley"}, shoot:{setup:"A genuine dirt cake made and shot beautifully — this only works if the food looks good. Then Wormsley inspecting it like a soil surveyor: examining texture, poking at the gummy worms, taking notes on a tiny clipboard. Play the assessment completely straight.", cast:"Wormsley + a real dirt cake + gummy worms + a tiny clipboard", tips:"Commit fully to the deadpan professional register — the joke dies if he winks. Do not make it an ad; the product appears at most once, glancingly. Keep everything in the compost/soil lane and nowhere near the toilet lane, especially with a dessert on screen. Never say ‘plastic-free.’"}, edit:{hook:"The dirt cake, revealed. Then Wormsley, appalled and fascinated.", pace:"Slow comic inspection; let each note land.", captions:"His assessment notes, one per beat.", audio:"Dry original VO as a formal inspection report. No trending sound needed.", overlays:"‘soil: convincing’ / ‘worms: unserious’ / ‘drainage: none’", length:"18–24s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Beauty shot of the finished dirt cake, overhead, genuinely appetising — gummy worms emerging from the crumb. Slow rotate.",txt:"dirt cake is back"},{t:"5–10s",dofilm:"Wormsley lowered into frame beside it on a tiny clipboard, regarding it with professional suspicion. Hold on the stare.",txt:"a professional was consulted"},{t:"10–16s",dofilm:"Three inspection inserts: he tests the crumb texture, prods a gummy worm which flops, peers into the layers for drainage.",txt:"soil: fine · worms: unserious"},{t:"16–21s",dofilm:"He makes a note. Verdict card placed beside the cake with tiny handwriting.",txt:"0/10 as a decomposition environment"},{t:"21–24s",dofilm:"Final wide: cake, worm, and just visible at the edge of frame, the compost bin outside the window. Do not point at it.",txt:"declined to comment on the taste"}], channels:[{k:"ig",who:"voice home + community",cut:"Lead cut — the full inspection bit; carousel of his written notes."},{k:"tt",who:"reach",cut:"Faster inspection; ‘a dessert made of soil and worms’ is the cold hook."}], test:{hyp:"A pure character bit with no product argument builds the mascot’s equity and outperforms product content on shares and comments, which is what makes later product posts land.",metric:"Shares and comment volume vs product-led posts; growth in Wormsley mentions in comments."}, amplify:"Organic only — a character bit that looks boosted stops being a joke and starts being an ad.", ladder:false, drove:["dirt cake is among 2026’s running food-trend revivals","the brand’s mascot is a worm and its product ends in soil — the overlap is unusually direct"], why:"An almost free cultural gift: a trending dessert made of fake soil and fake worms, in a brand built on real soil and a real worm. Pure character equity, and the kind of post people send to each other."},
  {id:"RC-0817-4", pillar:"RC", dna:"reply-worm", plat:"IG + TikTok", anchor:false, world:true, panelTags:["proof","funny"], concept:"Reply-worm to the hardest question in the inbox: ‘why should I trust you when every brand in this category overclaims?’ Answered by pointing at what the brand published before anyone required it.", hooks:["‘why should i trust YOU?’ — genuinely the best question we get","every brand in this category overclaims. here’s our answer to that.","fair question. here’s what we published before anyone made us."], rec:0, caption:"someone asked the best question we get: why should i trust you when every brand in this category overclaims? 🪱 completely fair, and the honest answer is that you should not trust any of us on vibes. so here is what we have already published without being asked. the full composition, including PBAT, which is petroleum-based. the certification body and the mark, DIN CERTCO home-compostable, which you can go and verify without us. the range, roughly 12–24 weeks, and the reason it is a range rather than a number. and the limitation — sealed in a landfill without air, it does not do its job. we said all of that before any rule required it, which is relevant this week, because the FDA has just proposed that companies must at minimum tell someone when they decide a substance touching food is fine. we are not the hero of that story. we are just already doing the paperwork. 🪱", lead:{ch:"Instagram",who:"voice home — the hard questions arrive here, so the answer belongs here"}, shoot:{setup:"Reply-to-comment format: the real question on screen, then a physical stack of the brand’s own receipts placed down one at a time — composition card, cert mark, the range, the limitation. Plain table, plain light. The lack of polish is the credibility.", cast:"Wormsley + the pack + four hand-written cards + hands", tips:"Do not get defensive and do not claim moral superiority — ‘we are not the hero of that story’ must survive to the final cut. Disclose PBAT as petroleum-based. Never say ‘plastic-free.’ Never state the GRAS proposal is law. Quote DIN CERTCO ~12–24 weeks exactly."}, edit:{hook:"The question on screen. ‘…yeah, that’s fair.’", pace:"Unhurried, plainspoken, one receipt at a time.", captions:"Each receipt named as it lands.", audio:"Dry original VO only, no bed.", overlays:"‘composition · certifier · the range · the limitation’", length:"22–30s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"The real comment on screen over a plain table. Wormsley enters frame, reads it, nods once. No defensiveness.",txt:"‘why should i trust you?’"},{t:"5–12s",dofilm:"Card one down: full composition, PBAT included and circled. Card two down: the DIN CERTCO mark, held up to camera.",txt:"composition · certifier"},{t:"12–19s",dofilm:"Card three: the 12–24 week range with ‘and why it’s a range’ under it. Card four: the landfill limitation, written plainly.",txt:"the range · the limitation"},{t:"19–26s",dofilm:"All four cards in one overhead frame beside the pack. Hand gestures once across them. That is the whole argument.",txt:"published before anyone asked"},{t:"26–30s",dofilm:"Back to Wormsley. Small shrug, no triumph.",txt:"we’re just doing the paperwork"}], channels:[{k:"ig",who:"voice home + trust",cut:"Lead cut — the reply format plus a saveable card of the four receipts."},{k:"tt",who:"reach",cut:"‘why should i trust you’ as a cold hook — scepticism travels."}], test:{hyp:"Answering the scepticism question with a stack of pre-existing disclosures converts sceptics better than any new claim, and the refusal to claim moral high ground is what makes it land.",metric:"Sentiment among first-time commenters; link taps from the post; whether the four-receipt card gets re-shared."}, amplify:"Boost to sceptics and comparison shoppers — this post converts the people actively trying to catch the category out.", ladder:true, drove:["the FDA’s GRAS proposal put self-declared safety in the news","the brand’s disclosures predate any requirement to make them","cert confusion is the category’s core trust problem"], why:"Meets the strongest objection in the category head-on and answers it with evidence that already existed. Refusing the moral high ground — ‘we’re just doing the paperwork’ — is what stops it reading as a boast."},

  return (
    <div className="perf-card">
      <h3>Your best content isn’t yours</h3>

  );
}

function BriefModal({b,onClose,onStudio,onIntel}){
  const c=getConv(b.id),P=PILLARS[b.pillar],reacts=panelReact(b);

  const [pmode,setPmode]=useState("static"); // static | loading | live | error
  const [live,setLive]=useState(null);
  async function runPanel(){
    setPmode("loading");
    try{
      const res=await fetch("/api/panel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.id,concept:b.concept,hooks:b.hooks,caption:b.caption,pillar:P.name,dna:b.dna})});

// ---- lightweight markdown → React (ported OBSOLETE renderer) ----
function stInline(t){
  const nodes=[]; let key=0, last=0, m;
  const re=/(\*\*([^*]+)\*\*)|(\*([^*]+)\*)|(`([^`]+)`)|(\[([^\]]+)\]\(([^)]+)\))/g;
  while((m=re.exec(t))){
    if(m.index>last) nodes.push(t.slice(last,m.index));
    if(m[1]) nodes.push(<strong key={key++}>{m[2]}</strong>);
    else if(m[3]) nodes.push(<em key={key++}>{m[4]}</em>);
    else if(m[5]) nodes.push(<code key={key++}>{m[6]}</code>);
    else if(m[7]) nodes.push(<a key={key++} href={m[9]} target="_blank" rel="noopener noreferrer">{m[8]}</a>);
    last=re.lastIndex;
  }
  if(last<t.length) nodes.push(t.slice(last));
  return nodes;
}
function renderMarkdown(md){
  const lines=(md||"").split("\n"), out=[]; let i=0,key=0,list=null,lt=null;
  const flush=()=>{ if(list){ out.push(lt==="ol"?<ol key={key++}>{list}</ol>:<ul key={key++}>{list}</ul>); list=null; } };
  const special=s=>/^(#{1,3}\s|>\s?|\s*[-*]\s|\s*\d+\.\s|\s*(---|\*\*\*)\s*$)/.test(s);
  while(i<lines.length){
    const ln=lines[i];
    if(/^\s*$/.test(ln)){ flush(); i++; continue; }
    if(/^###\s+/.test(ln)){ flush(); out.push(<h4 key={key++}>{stInline(ln.replace(/^###\s+/,''))}</h4>); i++; continue; }
    if(/^#{1,2}\s+/.test(ln)){ flush(); out.push(<h3 key={key++}>{stInline(ln.replace(/^#{1,2}\s+/,''))}</h3>); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(ln)){ flush(); out.push(<hr key={key++}/>); i++; continue; }
    if(/^\s*>\s?/.test(ln)){ flush(); out.push(<blockquote key={key++}>{stInline(ln.replace(/^\s*>\s?/,''))}</blockquote>); i++; continue; }
    const om=ln.match(/^\s*\d+\.\s+(.*)/);
    if(om){ if(lt!=="ol"){flush();lt="ol";} if(!list)list=[]; list.push(<li key={key++}>{stInline(om[1])}</li>); i++; continue; }
    const um=ln.match(/^\s*[-*]\s+(.*)/);
    if(um){ if(lt!=="ul"){flush();lt="ul";} if(!list)list=[]; list.push(<li key={key++}>{stInline(um[1])}</li>); i++; continue; }
    flush(); const para=[ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !special(lines[i])){ para.push(lines[i]); i++; }
    out.push(<p key={key++}>{stInline(para.join(" "))}</p>);
  }
  flush();
  return out;
}

function Studio({seed,onClearSeed}){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const scroll=useRef(null);
  useEffect(()=>{ if(scroll.current) scroll.current.scrollTop=scroll.current.scrollHeight; },[msgs,err]);
  const ctxLabel = seed ? (seed.type==="brief" ? seed.brief.concept : seed.text) : null;
  const sugg = seed ? (seed.type==="brief"?SUGG_BRIEF:SUGG_SIGNAL) : SUGG_DEFAULT;
  async function send(text){
    const q=(text!=null?text:input).trim(); if(!q||busy) return;
    setInput(""); setErr("");
    const base=[...msgs,{role:"user",content:q}];
    setMsgs([...base,{role:"assistant",content:""}]); setBusy(true);
    try{
      const res=await fetch("/api/studio",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:base,seed})});
      if(!res.ok||!res.body) throw new Error("api");
      const rd=res.body.getReader(),dec=new TextDecoder(); let acc="";
      for(;;){ const {done,value}=await rd.read(); if(done) break; acc+=dec.decode(value,{stream:true}); setMsgs(m=>{const c=m.slice();c[c.length-1]={role:"assistant",content:acc};return c;}); }
      if(!acc.trim()) throw new Error("empty");
    }catch(e){
      setMsgs(m=>m.slice(0,-1));
      setErr("The Strategist goes live the moment this is deployed to Vercel with your ANTHROPIC_API_KEY. Running locally there’s no server to answer — but the flow, the context, and the whole engine brain are wired and ready.");
    }finally{ setBusy(false); }
  }
  function onKey(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } }
  return (
    <div className="wrap"><div className="studio">
      {seed&&<div className="st-ctx"><span className="stx-lbl">{seed.type==="brief"?"✦ Sharpening brief":"✦ Riding signal"}</span><b>{ctxLabel}</b><button className="stx-x" onClick={onClearSeed} title="clear context">×</button></div>}
      <div className="st-scroll" ref={scroll}>
        {msgs.length===0 && (
          <div className="st-empty">
            <div style={{fontSize:34}}>🧠</div>
            <h2>The Strategist</h2>
            <p>Loaded with the full Compostic engine — the dry voice, the four pillars, Wormsley &amp; Cling, and the swap panel. Ask for scripts, hooks, bits, or a gut-check.{seed?" It already has this "+(seed.type==="brief"?"brief":"signal")+" in context — just ask.":""}</p>
            <div className="st-sugg">{sugg.map((s,i)=>(<button className="st-sg" key={i} onClick={()=>send(s.q)}><span className="sgl">{s.l}</span>{s.q}</button>))}</div>
          </div>
        )}
        {msgs.map((m,i)=>(
          <div className={"msg "+(m.role==="user"?"user":"bot")} key={i}>
            <div className="msg-av">{m.role==="user"?"🌱":"🧠"}</div>
            <div className="msg-bub">{m.role==="user"?m.content:(m.content?<>{renderMarkdown(m.content)}{busy&&i===msgs.length-1&&<span className="blink"></span>}</>:<span className="blink"></span>)}</div>
          </div>
        ))}
        {err&&<div className="st-err">{err}</div>}
      </div>
      <div className="st-inputbar">
        <textarea className="st-input" rows={1} value={input} placeholder="Ask the Strategist anything…" onChange={e=>setInput(e.target.value)} onKeyDown={onKey} disabled={busy}/>
        <button className="st-send" onClick={()=>send()} disabled={busy||!input.trim()}>↑</button>
      </div>
    </div></div>
  );
}
