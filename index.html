  {id:"FG-0810-1", amp:{headline:"The study, told straight — the caveat is the campaign", why:"The strongest health hook in months. It only works if it under-sells: the honest framing is what converts the sceptical low-tox buyer and protects the brand in an enforcement era.", budget:140, window:"Aug 12 – Aug 19", objective:"Saves + link taps from health-first audiences", guardrail:"Never state or imply human causation. Never claim Compostic prevents any condition. Auto-pause if comments restate it as proven human harm — that means the framing needs tightening, not more budget.", placements:[{platform:"Instagram", format:"Reel + carousel", budget:85, reach:"Warm + low-tox lookalikes", audience:"Low-tox home, clean living, parents", note:"Voice home — nuance survives here."},{platform:"TikTok", format:"In-feed Spark Ad", budget:55, reach:"Cold reach", audience:"Health-curious, kitchen swaps", note:"The caveat IS the hook for a sceptical cold audience."}]}, pillar:"FG", dna:"health-swap", plat:"IG + TikTok", anchor:true, world:true, proof:true, panelTags:["health","proof","swap"], concept:"A new study put polyethylene — the plastic in conventional cling wrap — on fatty-liver markers. The brief states the finding and the animal-model limitation with exactly equal weight, and lets the restraint do the persuading.", hooks:["new study: the plastic in cling wrap, and the liver. here’s the honest version.","this is a mouse study. we’re still not thrilled about it.","a brand telling you why its own best headline is smaller than it looks"], rec:0, caption:"a study published august 7 in Science Advances found that polyethylene — the plastic used in conventional cling wrap, bags and cup linings, about a third of all plastic made — raised markers of fatty liver disease on its own, and made things worse alongside a high-fat, high-sugar diet 🥪 now the part most accounts will quietly skip: this was an ANIMAL model. it shows a biological pathway. it is not proof of what happens in people, and anyone telling you otherwise is selling something. we sell something too. so here’s the small version: this is the material that sits on your leftovers every night, the evidence around it keeps stacking up, and there’s a version of that drawer that composts in your own bin in about 12–24 weeks instead. no panic. just possibly the easiest swap in the kitchen.", lead:{ch:"Instagram",who:"voice home — a nuanced health message needs an audience that already trusts the voice"}, shoot:{setup:"Deliberately plain. The study on a screen, the finding highlighted, then the LIMITATION highlighted with identical treatment and identical screen time. Cut to a real fridge: plastic-wrapped leftovers, then the same leftovers wrapped in Compostic. No doom imagery, no scare music, no bodies, no organs.", cast:"Hands + a screen showing the study + real leftovers + Wormsley", tips:"The caveat gets the SAME font, the SAME duration, the SAME emphasis as the finding — this is the whole brief. Never say cling wrap causes liver disease. Never imply Compostic has a health benefit; the only claim is less conventional plastic touching food. Never say ‘plastic-free.’"}, edit:{hook:"The finding on screen, then immediately ‘ANIMAL MODEL’ highlighted in the same style.", pace:"Calm, measured, deliberately unsensational.", captions:"Study name and date on screen; limitation in identical treatment.", audio:"Quiet original VO. No dramatic sound design — the restraint is the message.", overlays:"‘Science Advances · Aug 7, 2026’ / ‘animal model — not human proof’.", length:"25–35s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"The finding, plainly stated.",txt:"polyethylene · fatty-liver markers"},{t:"5–14s",dofilm:"The limitation, equal weight, equal time.",txt:"animal model. not human proof."},{t:"14–26s",dofilm:"The fridge: wrapped leftovers, then the swap.",txt:"the material on your leftovers"},{t:"26–32s",dofilm:"Wormsley, calm. No panic.",txt:"no panic. just an easier drawer."}], channels:[{k:"ig",who:"voice home + trust",cut:"Lead cut — the honest read, plus a carousel separating ‘what it found’ from ‘what it did not.’"},{k:"tt",who:"reach",cut:"Tighter cut with the caveat fully intact — the honesty is the hook for cold, sceptical viewers."}], test:{hyp:"Stating a health study’s limitation as prominently as its finding builds more purchase intent among health-driven buyers than a looser, scarier version would.",metric:"Saves and sentiment; specifically watch for comments crediting the honesty. Compare link taps to previous health posts."}, amplify:"Boost to low-tox and health-first audiences only. Pause immediately if the comment section starts restating it as proven human harm.", ladder:true, drove:["Science Advances study published Aug 7, 2026 on polyethylene and fatty-liver markers","packaging is a measured source of microplastic migration into food","health, not planet, is the core buyer’s actual motivator"], why:"The strongest health hook in months, handled the only way this brand can afford to handle it. Competitors will overstate it or ignore it — saying the caveat as loudly as the finding is precisely what makes Compostic the account people believe next time."},
  {id:"GS-0810-1", amp:{headline:"The confession — say what compostable does NOT do", why:"Volunteering the limitation is the single highest-trust asset available, and it sets up the compost proof. Nobody else in the category will run this, which is exactly why it travels.", budget:110, window:"Aug 13 – Aug 19", objective:"Saves + profile visits — an authority and trust buy", guardrail:"Do not turn the confession into a humblebrag. Do not imply competitors are lying. Never say ‘plastic-free.’ If comments read it as an admission the product doesn’t work, the follow-up compost proof must be pinned immediately.", placements:[{platform:"Instagram", format:"Reel", budget:65, reach:"Warm + sceptics", audience:"Sustainability-literate, eco-sceptic", note:"The people most likely to catch the category out are the people this converts."},{platform:"TikTok", format:"In-feed", budget:45, reach:"Cold", audience:"Callout-culture adjacent", note:"‘a brand admitting the bad bit’ is inherently watchable."}]}, pillar:"GS", dna:"wormsley-bit", plat:"IG + TikTok", anchor:false, world:false, proof:true, panelTags:["proof","funny","character"], concept:"Wormsley admits the unglamorous thing: sealed in a landfill with no oxygen, compostable film does not do its job. It needs a bin. The confession earns the proof that follows it.", hooks:["the bit we’d rather not tell you about compostable packaging","our wrap doesn’t work everywhere. here’s where it doesn’t.","a worm, admitting the flaw in his own business model"], rec:0, caption:"time for the unglamorous bit 🪱 compostable does not mean magic. sealed in a landfill, packed tight with no oxygen, our wrap does not do the job it was designed to do — very little does down there. it needs a compost bin, a garden heap, or a council collection that actually takes it. we could not mention this. most of the category doesn’t. but you’re going to find out eventually, and we’d rather you heard it from the worm. so: home-compostable, certified by DIN CERTCO, roughly 12–24 weeks in a real home bin. give it air and it disappears into soil. bury it in a landfill and it’s just a slightly better-behaved piece of packaging. that’s the honest deal.", lead:{ch:"Instagram",who:"voice home — a confession needs the audience that already trusts you, then it travels"}, shoot:{setup:"Wormsley at his most deadpan, delivering bad news about his own product. Split the visual: a sealed airless bag (the landfill condition) versus an open compost bin with air and worms. Show both honestly. End on the bin, not the bag.", cast:"Wormsley + a sealed bag + a real compost bin + hands", tips:"Do not spin the confession into a brag. Do not accuse competitors of hiding it. The tone is matter-of-fact, mildly apologetic, then genuinely warm on the resolution. Quote DIN CERTCO ~12–24 weeks exactly. Compost lane only, never toilet."}, edit:{hook:"‘right. the bit we don’t put on the front of the box.’", pace:"Slow, honest, then a warm turn at the resolution.", captions:"Plain and unspun.", audio:"Dry original VO only. No music under the confession; bring it in on the resolution.", overlays:"‘landfill: no air, no job’ vs ‘compost bin: ~12–24 wks (DIN CERTCO)’.", length:"25–32s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Wormsley, serious. The sealed bag.",txt:"the bit we’d rather skip"},{t:"5–15s",dofilm:"The landfill condition explained plainly.",txt:"no oxygen = no breakdown"},{t:"15–26s",dofilm:"The compost bin, air, worms, the turn.",txt:"give it air and it becomes soil"},{t:"26–32s",dofilm:"Wormsley, warm again.",txt:"that’s the honest deal"}], channels:[{k:"ig",who:"voice home + trust",cut:"Lead cut — the confession, with the compost time-lapse pinned as the follow-up."},{k:"tt",who:"reach",cut:"‘watch a brand admit the flaw in its own product’ framing for cold reach."}], test:{hyp:"Volunteering the product’s central limitation increases trust and conversion more than it costs in doubt, especially among sceptical high-intent buyers.",metric:"Sentiment shift in comments; saves; whether the disclosure gets quoted approvingly by third parties or press."}, amplify:"Boost to sceptics and comparison shoppers — this converts the people actively trying to catch the category out.", ladder:true, drove:["PepsiCo just dropped biodegradability from its packaging goals rather than keep promising it","cert confusion is the category’s real enemy","the confession sets up the compost proof series"], why:"The most defensible piece of content the brand can make. In a category where everyone overclaims and regulators are actively fining for it, the brand that names its own limitation first becomes the one people believe about everything else."},
  {id:"RC-0810-1", pillar:"RC", dna:"compost-reveal", plat:"IG + TikTok", anchor:false, world:false, proof:true, panelTags:["proof"], concept:"Where it actually goes: the compost time-lapse, and then the payoff nobody films — the finished soil, with something growing in it. The full circle, filmed rather than claimed.", hooks:["we buried our wrap months ago. here’s what it is now.","the end of the time-lapse: it’s soil. things are growing in it.","the receipt that takes a season to earn"], rec:0, caption:"the ongoing experiment, and the part we’ve been waiting for 🧾 we buried a piece of Compostic wrap in a normal home compost bin and kept filming it. no swapping in a fresher piece, no industrial facility, no speeding up the timeline — just a bin, a garden, and patience. certified home-compostable by DIN CERTCO, roughly 12–24 weeks depending on your bin, the weather, and how often you turn it. that variability is real and we’d rather say it than promise you a date. and here’s the bit that makes the whole thing worth it: what it turns into isn’t nothing, it’s soil. the tomatoes are in it. that’s the full circle, and it’s the one receipt this category mostly refuses to film.", lead:{ch:"Instagram",who:"voice home — the long-running proof series belongs with the people following the story"}, shoot:{setup:"Continue the standing time-lapse: same bin, same marked spot, same camera position — consistency is what makes it credible. Then the new payoff: sift the finished compost, show it in a hand, and show it being used on a real plant with real produce on it.", cast:"Hands + compost bin + finished soil + a growing plant + Wormsley narrating", tips:"Never speed up or restage. State the variables honestly — bin type, temperature, turning frequency all change the timeline. Do not claim a fixed number of weeks for every household. Quote DIN CERTCO ~12–24 weeks. Compost lane, never toilet — this touches food."}, edit:{hook:"The bin opened, the marked spot found.", pace:"Slow, documentary, genuinely satisfying at the payoff.", captions:"Week number + honest conditions.", audio:"Natural garden sound + dry Wormsley VO.", overlays:"‘week N’ + ‘DIN CERTCO home-compostable · ~12–24 weeks’.", length:"18–25s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Bin opened, marked spot located.",txt:"the experiment, continued"},{t:"4–12s",dofilm:"What’s left of the wrap; conditions stated.",txt:"week N · honest conditions"},{t:"12–20s",dofilm:"Finished compost sifted in a hand.",txt:"it’s soil now"},{t:"20–25s",dofilm:"The soil around a real plant with produce on it.",txt:"and the tomatoes are in it"}], channels:[{k:"ig",who:"voice home + long-form proof",cut:"Lead cut — the payoff episode; pin the series as a highlight so new followers can binge it."},{k:"tt",who:"reach",cut:"Recap cut for new eyes — ‘we’ve been burying this for months. look.’"}], test:{hyp:"Completing the decomposition story with a visible soil-and-growth payoff converts better than mid-series updates, because it resolves the doubt instead of just documenting it.",metric:"Saves and shares vs earlier episodes; follows attributable to the series; link taps within 72h."}, amplify:"Organic — the credibility comes from it not looking bought. Pin it under the confession brief.", ladder:true, drove:["‘does it actually break down?’ remains the core doubt","competitors certified only to industrial standards cannot reproduce this in a backyard bin","the confession brief needs its proof"], why:"The single most defensible asset the brand owns, finally paid off. Any competitor certified only to an industrial standard physically cannot film this in a home bin — which makes the series a moat that compounds every week it runs."},
  {id:"RC-0810-2", pillar:"RC", dna:"torture-test", plat:"TikTok + IG", anchor:false, world:false, proof:true, panelTags:["proof","swap","funny"], concept:"THE OVERNIGHT BOWL TEST: cover a bowl of leftovers, fridge it overnight, and see whether the seal held and the food is still good in the morning. Filmed honestly — a partial fail stays in the cut.", hooks:["cover a bowl, fridge it overnight. does it still hold in the morning?","the least glamorous test we run, and the one people actually ask for","no cuts. and yes, we kept the bad bit in."], rec:0, caption:"‘but does it actually hold overnight on a bowl?’ genuinely the most-asked practical question we get 🧾 so: real leftovers, real bowl, covered, into a real fridge, filmed going in and filmed coming out twelve hours later. no cuts at either end. did the seal stay put, did the edge lift, is the food still good in the morning — including whatever we’d rather have edited out. our wrap is designed to break down in a compost bin in about 12–24 weeks, so the fair question is whether it does its job for the day or two it needs to first. watch it and judge for yourself. that is the entire point of a receipt.", lead:{ch:"TikTok",who:"reach — a practical test answers the objection that actually blocks the sale"}, shoot:{setup:"A genuinely timed test with a visible clock at both ends: cover a bowl of real leftovers, into a real fridge overnight, uncover on camera in the morning. Single continuous takes. If the edge lifts or the seal slips, that stays in the video.", cast:"Hands + a bowl of real leftovers + a fridge + a visible clock + Wormsley as judge", tips:"Honesty is the product here — a partial fail shown openly outperforms a flawless edit. Do not claim it outlasts plastic; the pitch is ‘does the job, then composts.’ Never say ‘plastic-free.’ Keep the compost lane."}, edit:{hook:"Bowl covered, clock showing the time, fridge door shuts.", pace:"Time-stamped, quietly tense, satisfying reveal.", captions:"Time stamps throughout; a plain verdict card at the end.", audio:"TikTok: original audio + natural fridge sound · IG: light satisfying bed.", overlays:"‘10pm → 10am’ ticker; honest verdict card.", length:"15–22s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Bowl of leftovers covered; clock visible.",txt:"10pm"},{t:"4–9s",dofilm:"Fridge door closes. Cut.",txt:"twelve hours"},{t:"9–17s",dofilm:"Morning: uncover, inspect the seal and the food.",txt:"10am"},{t:"17–22s",dofilm:"Honest verdict; Wormsley judges.",txt:"the verdict, unedited"}], channels:[{k:"tt",who:"reach / new eyes",cut:"Lead cut — the test, the honest verdict, no mercy."},{k:"ig",who:"voice home + saves",cut:"Same test plus a short ‘how to get a better seal on a bowl’ technique carousel."}], test:{hyp:"A mundane, practical overnight test answers the real purchase objection more persuasively than any performance claim, and outperforms aspirational content on saves.",metric:">2× owned average on saves and shares; lift in link taps within 72h."}, amplify:"Organic first to read the honest result, then boost into kitchen-swap and low-tox interests.", ladder:true, drove:["‘does it actually seal?’ is the core practical objection","peak leftovers season makes the bowl the most relevant test surface"], why:"Answers the practical question that blocks the swap, using the least glamorous possible demonstration. Filming the imperfect result is exactly what makes every other receipt this brand publishes believable."},
  {id:"RC-0810-3", pillar:"RC", dna:"torture-test", plat:"IG + TikTok", anchor:false, world:false, proof:true, panelTags:["proof","swap"], concept:"THE FREEZER TEST: batch-prep season is starting, so wrap it, freeze it, and see whether it cracks, sticks or holds at freezer temperature. The test nobody has asked for yet and everybody will in September.", hooks:["does compostable wrap survive the freezer? we froze it to find out.","batch-prep season starts now — so we put it in the freezer for a week","the test we’re running before you need the answer"], rec:1, caption:"batch-prep season is about to restart, so here’s the question ahead of the queue: does it hold in the FREEZER? 🧾 we wrapped real portions, froze them for a week, and pulled them out on camera — checking for cracking, for the wrap going brittle, for freezer burn on the food underneath, for whether the seal survived the temperature at all. our wrap is designed to break down in a home compost bin in about 12–24 weeks, and the fair question is whether it stays intact through the job you need it for first. the honest results are in the video, including the bits that would be easier to leave out. one note we’ll give away free: wrap tight, freeze fast, and don’t overfill the portion.", lead:{ch:"Instagram",who:"voice home — a technique-plus-proof post is what the existing audience saves"}, shoot:{setup:"A real week-long freezer test: wrap real portions, date-label them, freeze, then unwrap on camera after seven days. Show cracking or brittleness honestly if it happens. Include the practical technique tips as part of the video — this is proof AND a how-to.", cast:"Hands + real food portions + freezer + labels + Wormsley", tips:"Report the result honestly including any failure mode, and pair every weakness with the technique that mitigates it. Do not claim freezer performance parity with conventional plastic unless the test actually shows it. Quote DIN CERTCO ~12–24 weeks. Never say ‘plastic-free.’"}, edit:{hook:"Portions going into the freezer, date label visible.", pace:"Brisk, practical, useful.", captions:"Day counter; technique tips as they arise.", audio:"Original audio + natural sound.", overlays:"‘day 1 → day 7’; ‘wrap tight · freeze fast · don’t overfill’.", length:"18–24s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Portions wrapped and labelled, into the freezer.",txt:"day 1"},{t:"4–10s",dofilm:"Freezer door; time passes.",txt:"seven days"},{t:"10–18s",dofilm:"Unwrap on camera; inspect wrap and food.",txt:"day 7 · the honest result"},{t:"18–24s",dofilm:"Technique tips; Wormsley approves.",txt:"wrap tight · freeze fast"}], channels:[{k:"ig",who:"voice home + saves",cut:"Lead cut — proof plus technique, built to be saved before batch-prep season."},{k:"tt",who:"reach",cut:"Faster cut; ‘does it survive the freezer’ is the hook."}], test:{hyp:"Publishing a use-case test BEFORE the season that needs it captures the search and save behaviour early and positions the brand as the practical authority.",metric:"Saves now vs referral traffic in September; whether the post keeps earning after the initial window."}, amplify:"Low boost now, then re-boost into batch-prep and meal-prep interests as the season starts.", ladder:false, drove:["batch-prep and freezer season restarts as the school routine settles","freezer performance is an unanswered practical question for compostable film"], why:"Gets ahead of the next season’s objection instead of chasing it, and pairs proof with technique — the combination that turns a sceptical viewer into someone who knows how to use the product properly."},
  {id:"RC-0810-4", pillar:"RC", dna:"health-swap", plat:"IG + TikTok", anchor:false, world:false, panelTags:["health","proof"], concept:"About 130 milligrams a year. That is the per-person number someone finally put on the plastic coming off food packaging — and unlike ‘1,000 tonnes,’ it is a figure a person can actually picture.", hooks:["someone finally worked out the per-person number. it’s about 130mg a year.","the microplastics conversation keeps skipping the packet it came in","not misused. not overheated. just opened and closed, like packaging."], rec:1, caption:"most microplastics content is about oceans and fish, which is real, and slightly beside the point at dinner 🥪 a report called ‘From Pack to Plate’ — put together by Earth Action with rePurpose Global, the first global synthesis on this — estimates around 1,000 tonnes of microplastics move from food packaging into food and drink every year. which is a number nobody can picture, so here is the one you can: roughly 130 milligrams a year for an average person, and over a gram if you get through a lot of packaging. and it is not caused by misuse. it is material, design, and ordinary handling — opening things, closing things, the caps and the seams. we are not going to tell you what that does inside a person, because the honest answer is that the research is still working it out. we will say the smaller, duller, more useful thing: the film touching your food is one of the sources, and it is one of the very few you can change without changing your life.", lead:{ch:"Instagram",who:"voice home — the structural explainer performs with the audience that reads captions"}, shoot:{setup:"Build the pathway physically on a counter: packet → food → plate, using real packaged items. Deliberately avoid ocean and wildlife imagery entirely — the entire point is relocating the story into the kitchen.", cast:"Hands + real packaged food + a plate", tips:"Do NOT state health outcomes. The claim is about presence and source, never harm. Never say ‘plastic-free.’ Dry and non-alarmist — the restraint is what separates this from wellness-scare content."}, edit:{hook:"‘we need to talk about the packet, not the ocean.’", pace:"Explanatory, calm, tight.", captions:"The pathway labelled at each step; the per-person figure held on screen.", audio:"Quiet original VO.", overlays:"‘~130mg a year, per person’ / ‘not misuse — material, design, handling’ / ‘From Pack to Plate, 2026’.", length:"20–28s", aspect:"9:16 + carousel"}, scenes:[{t:"0–5s",dofilm:"An ocean image dismissed; the counter shown instead.",txt:"not the ocean. the packet."},{t:"5–16s",dofilm:"The pathway built: packet → food → plate.",txt:"~130mg a year, per person"},{t:"16–24s",dofilm:"The scale card, then the one changeable drawer.",txt:"over a gram if you use a lot"}], channels:[{k:"ig",who:"voice home + saves",cut:"Lead cut — Reel plus a carousel of the pathway, built to be saved."},{k:"tt",who:"reach",cut:"Faster explainer; ‘used exactly as intended’ is the hook."}], test:{hyp:"A concrete per-person figure (~130mg a year) drives more personal relevance and more saves than either an ocean framing or an abstract global tonnage.",metric:"Saves vs previous microplastics posts; watch comments move from ‘that’s sad’ to ‘what do I use instead.’"}, amplify:"Boost to low-tox and health-curious audiences; retarget savers with the overnight bowl test.", ladder:true, drove:["‘From Pack to Plate’ (Earth Action + rePurpose Global) put a per-person figure on packaging-borne microplastics","release is driven by material, design and ordinary handling — not misuse"], why:"Builds the intellectual bridge the whole FG pillar depends on — from a headline people feel helpless about to the one drawer they can act on — without making a single health claim the brand cannot defend."},
  {id:"GS-0810-2", pillar:"GS", dna:"plastic-villain", plat:"TikTok + IG", anchor:false, world:false, panelTags:["funny","character","swap"], concept:"Cling has been in the fridge since June. He’s covering something nobody can identify, he refuses to leave, and he is technically still in perfect condition — which is exactly the problem.", hooks:["Cling has been in this fridge since june. he looks great. that’s the issue.","the roll at the back of the drawer that will outlive everyone in this house","he’s not going anywhere. that’s his whole thing."], rec:0, caption:"end-of-summer fridge audit and look who’s still here 🎈 Cling. covering something from june that we are no longer able to identify. still structurally perfect, not a mark on him, absolutely thriving — which is the bit people miss. that’s not durability, that’s a refusal to leave. ‘i’ll be here for 500 years, babe’ is not a flex, Cling, it’s a warning. meanwhile the piece of our wrap that covered the tomatoes in may is now soil in the garden, holding up a courgette plant. one of them is contributing. 🪱", lead:{ch:"TikTok",who:"reach — character comedy travels furthest to new eyes"}, shoot:{setup:"A real end-of-summer fridge audit — genuinely slightly chaotic, not styled. Cling (balloon / 2D puppet) found at the back, immaculate, covering an unidentifiable container. Hard cut to the garden and the finished compost. The contrast between ‘perfectly preserved’ and ‘became soil’ is the whole joke.", cast:"Cling + Wormsley + a real fridge + a garden bed", tips:"The villain is the material, never the person who owns it. Never name or imply a rival brand’s packaging. Never say ‘plastic-free.’ Keep the compost lane, never toilet."}, edit:{hook:"Fridge door opens; Cling at the back, gleaming.", pace:"Comedic beat, then a genuinely satisfying garden turn.", captions:"Dry, minimal.", audio:"TikTok: a trending comedic sound (pull live) · IG: original audio.", overlays:"‘still perfect after 3 months’ on Cling; ‘~12–24 weeks · now soil’ on the turn.", length:"15–20s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Fridge audit; Cling discovered, immaculate.",txt:"since june."},{t:"5–10s",dofilm:"He refuses to leave. Unbothered.",txt:"‘i’ll be here for 500 years, babe’"},{t:"10–16s",dofilm:"Cut to the garden: the compost, the plant.",txt:"ours became soil"},{t:"16–20s",dofilm:"Wormsley, quietly smug.",txt:"one of them is contributing"}], channels:[{k:"tt",who:"reach / new eyes",cut:"Lead cut — trending comedic sound, fridge gag, garden payoff."},{k:"ig",who:"voice home",cut:"Warmer cut; pair it with the compost time-lapse as the proof."}], test:{hyp:"Reframing plastic’s durability as a character flaw rather than an environmental statistic lands the point without preaching and outperforms fact-led posts on shares.",metric:"Shares and non-follower reach vs the brand’s fact-led posts."}, amplify:"Cheap cold boost on TikTok if organic reach clears the average within 24h.", ladder:false, drove:["end-of-summer fridge clear-out is a live, universal moment","the compost payoff gives the villain bit a real proof to land on"], why:"Turns the product’s core mechanism into a joke about a personality flaw, which is the only way this brand ever wants to make an environmental point — and it attacks the material rather than the customer holding it."},
  {id:"GS-0810-3", pillar:"GS", dna:"moment-jack", plat:"IG + TikTok", anchor:false, world:false, panelTags:["swap","moment","funny"], concept:"The glut. Too many tomatoes, a courgette nobody asked for, herbs going over, half a melon. Wrap it, save it, and the wrap ends up in the soil the next lot grows in. The full circle told without a single claim.", hooks:["it is peak ‘use it before it turns’ season and the fridge is a crime scene","too many tomatoes. a courgette nobody asked for. half a melon. wrap it.","the most on-brand loop we have: soil, wrap, soil"], rec:0, caption:"peak glut season and the fridge is entirely out of control 🍅 too many tomatoes, a courgette nobody asked for, herbs going over, half a melon that’s been eyeing us up for days. so: wrap it, save it, actually eat it. that’s the whole post — no lecture, no stat, nobody’s being told off. the only quiet part worth mentioning is where it ends up. the produce came out of soil, the wrap keeps it going a few more days, and then the wrap goes in the compost bin and becomes soil again — roughly 12–24 weeks, certified home-compostable. it’s a loop. we didn’t design it, we just stopped interrupting it. 🪱", lead:{ch:"Instagram",who:"voice home — the seasonal, warm, non-preachy register lands best with the existing audience"}, shoot:{setup:"A real August fridge and a real haul — genuinely too much produce, not a styled flat-lay. Wrap each thing quickly, satisfying and practical. Then the loop: the compost bin, then the garden bed with produce growing. Warm afternoon light throughout.", cast:"Hands + real produce + fridge + compost bin + garden", tips:"Say nothing about plastic and nothing about the planet — the loop does the work visually. No stats, no guilt. Quote the cert only once, gently. Never say ‘plastic-free.’ Compost lane only."}, edit:{hook:"Fridge opens on genuine produce chaos.", pace:"Warm, practical, satisfying.", captions:"Light and conversational.", audio:"Warm acoustic bed or a gentle trending sound (pull live).", overlays:"Minimal — one soft ‘home-compostable · ~12–24 wks’ on the compost beat.", length:"18–25s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"The glut: fridge and counter, genuinely overloaded.",txt:"use it before it turns"},{t:"5–14s",dofilm:"Wrapping each thing, quick and satisfying.",txt:"saved"},{t:"14–20s",dofilm:"The wrap into the compost bin.",txt:"then it goes back"},{t:"20–25s",dofilm:"Garden bed, produce growing in the soil.",txt:"soil → food → soil"}], channels:[{k:"ig",who:"voice home",cut:"Lead cut — the seasonal loop; carousel of ‘what to wrap this week.’"},{k:"tt",who:"reach",cut:"Faster glut cut; the loop reveal is the payoff."}], test:{hyp:"A purely seasonal, claim-free post that shows the full soil-to-soil loop outperforms message-led content on completion rate and reaches beyond the eco audience.",metric:"Video completion rate; % non-follower reach; saves from gardening and food-waste audiences."}, amplify:"Light boost into gardening, food-waste and home-cooking interests through the glut window.", ladder:false, drove:["peak home-garden and market abundance is live right now","the soil-to-soil loop is the product story told without a claim"], why:"The most on-brand story the product has, told entirely in pictures. It reaches gardeners and home cooks who would never engage with a sustainability post, and makes the environmental point without once making it."},
  {id:"GS-0810-4", pillar:"GS", dna:"wormsley-bit", plat:"IG + TikTok", anchor:false, world:false, panelTags:["funny","character"], concept:"IN SIX MONTHS, YOU CAN… — the end-of-summer edition. Watch the garden die and come back. Fail to use the tomatoes. Forget an entire password. …Or compost the wrap that covered the melon in August.", hooks:["IN SIX MONTHS YOU CAN: kill a houseplant. compost this wrap. one is on purpose.","six months from now the garden’s back and this wrap is soil","a list of things that take roughly as long as our wrap takes to disappear"], rec:0, caption:"IN SIX MONTHS, YOU CAN 🪱 watch the entire garden die off and come back again. fail, comprehensively, to use up the tomatoes. forget a password you set with total confidence. finally read the book. …or compost the piece of Compostic wrap that covered half a melon in august, because in a home bin it breaks down in roughly 12–24 weeks. by the time you’re thinking about seeds again, it’s soil. the melon is a distant memory. the wrap is genuinely gone. only one of those things is unusual, and it’s not the melon.", lead:{ch:"Instagram",who:"voice home — the absurdist list is a signature bit and it plays best to the fans"}, shoot:{setup:"The signature ‘IN SIX MONTHS’ format — rapid hand-flipped cards, one small visual gag each, landing on the wrap. Tie every item to a seasonal six-month arc so the timeframe does real explanatory work.", cast:"Hands + prop cards + a dying houseplant + Wormsley cameo", tips:"Four items maximum before the payoff. The cert line must be exact: home-compostable, DIN CERTCO, ~12–24 weeks. Never say the wrap ‘disappears into nothing’ — say it composts. Keep it genuinely funny; a flat list is worse than no list."}, edit:{hook:"‘IN SIX MONTHS, YOU CAN—’ card slams in.", pace:"Rapid card flips, one gag each, then a slow final beat.", captions:"Big type, one item per card.", audio:"Upbeat original audio or a light list-format trending sound (pull live).", overlays:"Item counters; final card ‘~12–24 weeks · home-compostable · DIN CERTCO’.", length:"15–20s", aspect:"9:16"}, scenes:[{t:"0–3s",dofilm:"Title card.",txt:"IN SIX MONTHS, YOU CAN…"},{t:"3–12s",dofilm:"Four gag items, one card each.",txt:"a garden · the tomatoes · a password · the book"},{t:"12–18s",dofilm:"The wrap card; Wormsley nods once.",txt:"…or compost this."}], channels:[{k:"ig",who:"voice home",cut:"Lead cut — signature list bit; carousel version for saves."},{k:"tt",who:"reach",cut:"Faster cuts, punchier gags, identical payoff."}], test:{hyp:"Anchoring the signature list bit to a seasonal six-month arc makes the compost timeframe concrete and improves comprehension of what home-compostable actually means.",metric:"Comment comprehension — people restating the timeframe correctly — plus saves vs owned average."}, amplify:"Organic; boost only if it over-indexes with gardening audiences.", ladder:false, drove:["the six-month seasonal arc makes the decomposition window tangible","~12–24 weeks is the fact people find hardest to picture"], why:"Turns the single most abstract product fact — a decomposition window — into something people can feel against a season they’re already living through. The signature bit doing genuine explanatory work."},
  {id:"FG-0810-2", pillar:"FG", dna:"health-swap", plat:"IG + TikTok", anchor:false, world:false, panelTags:["health","swap"], concept:"Low-tox has moved from what’s IN the food to what the food TOUCHES. The pan, the bottle, the container, the wrap. This brief meets that conversation exactly where it already is.", hooks:["you changed the pan. you changed the bottle. the wrap is the one left.","low-tox went from ingredients to containers. this is the last drawer.","the swap people always mean to make and never actually get to"], rec:1, caption:"the low-tox conversation moved 🥪 it used to be entirely about what was IN the food — the ingredients, the additives, the list on the back. now it’s about what the food TOUCHES. people changed the pan. changed the water bottle. changed the storage containers. and then, almost universally, stopped — because the wrap is the one where there wasn’t an obvious answer, and honestly for a long time there wasn’t a good one. it’s a roll you buy without thinking, it lives in a drawer, and it touches food directly for hours at a time. ours is certified home-compostable by DIN CERTCO and breaks down in a home bin in roughly 12–24 weeks. same drawer, same nine seconds, one fewer thing to get to.", lead:{ch:"Instagram",who:"voice home — the low-tox audience lives here and converts on health framing"}, shoot:{setup:"A visual progression of the swaps people have already made: pan, bottle, container — each shown briefly, each ticked off. Then the drawer, still holding the old roll. The narrative is ‘you already did the hard ones.’", cast:"Hands + pan + bottle + containers + the drawer + the roll", tips:"Frame as completion, never as failure — the viewer has already done the work, this is the last item. No guilt whatsoever. Do not claim health benefits for Compostic; the claim is only that it’s a compostable alternative to the conventional wrap. Never say ‘plastic-free.’"}, edit:{hook:"Pan. Bottle. Container. Tick, tick, tick.", pace:"Quick progression, then a slow beat on the drawer.", captions:"One word per swap.", audio:"Calm original VO or a soft trending bed.", overlays:"Ticks on each completed swap; ‘home-compostable · ~12–24 wks’ on the last.", length:"15–22s", aspect:"9:16"}, scenes:[{t:"0–8s",dofilm:"The swaps already made: pan, bottle, containers.",txt:"done · done · done"},{t:"8–15s",dofilm:"The drawer opens. The old roll is still there.",txt:"and then this one"},{t:"15–22s",dofilm:"The swap made; drawer closes.",txt:"same drawer. same nine seconds."}], channels:[{k:"ig",who:"voice home + low-tox audience",cut:"Lead cut — the completion framing; carousel of ‘the swaps you’ve already made.’"},{k:"tt",who:"reach",cut:"Faster progression; ‘the last drawer’ is the hook."}], test:{hyp:"Framing the wrap as the final item on a list the viewer has already been working through converts better than framing it as a new thing to start.",metric:"Link taps from low-tox audiences; comments recognising themselves in the progression."}, amplify:"Boost to low-tox, clean-living and non-toxic-home interests — the highest-intent audience the brand has.", ladder:true, drove:["low-tox parenting keeps moving from ingredients to containers","the wrap is the least-solved item in that progression"], why:"Meets the highest-intent audience precisely where their conversation already is, and reframes the purchase as finishing something rather than starting something — which is a materially easier decision to make."},
  {id:"FG-0810-3", pillar:"FG", dna:"moment-jack", plat:"TikTok + IG", anchor:false, world:false, panelTags:["health","swap","funny"], concept:"The half-avocado problem. Everyone has a method, all the methods are wrong, and the thing people reach for is a sheet of polyethylene pressed directly onto the food. A universal kitchen argument with a product answer.", hooks:["everyone has a half-avocado method and every single one of them is wrong","the most argued-about food storage question on the internet","stone in? lemon on? water? none of you are right"], rec:0, caption:"the half-avocado discourse is one of the great unresolved arguments of our time 🥪 leave the stone in. squeeze lemon on it. submerge it in water. put it face down. every single one of these has a devoted following and none of them fully work, which is why the actual answer is always ‘and then wrap it.’ which means, for most people, pressing a sheet of polyethylene directly onto the exposed surface of something they’re going to eat tomorrow. that’s the bit nobody argues about, and it’s the only bit we’d change. ours is certified home-compostable, DIN CERTCO, roughly 12–24 weeks in a home bin. keep your method. we’re not getting involved in the stone thing.", lead:{ch:"TikTok",who:"reach — an argument people already have is the cheapest possible entry into a new audience"}, shoot:{setup:"Rapid-fire the competing methods — stone in, lemon, water, face down — each shown for a beat and gently dismissed. Then the universal step everyone actually does: wrapping it. Keep it playful and genuinely non-judgemental about people’s methods.", cast:"Hands + several avocado halves + the competing props + the roll", tips:"Do not declare a winner among the methods — the joke is that everyone believes theirs. No health claim: this is about what touches the food, stated neutrally. Never say ‘plastic-free.’ Keep it light."}, edit:{hook:"Four avocado halves lined up, four methods.", pace:"Fast, argumentative, funny, then a calm resolution.", captions:"One method per beat.", audio:"TikTok: a trending debate or chaos sound (pull live) · IG: original.", overlays:"Method labels; then ‘the bit nobody argues about’.", length:"12–18s", aspect:"9:16"}, scenes:[{t:"0–6s",dofilm:"The four methods, rapid-fire, each dismissed.",txt:"stone · lemon · water · face down"},{t:"6–12s",dofilm:"The universal step: wrapping it.",txt:"and then everyone does this"},{t:"12–18s",dofilm:"The swap; Wormsley stays out of the argument.",txt:"keep your method."}], channels:[{k:"tt",who:"reach / debate-driven",cut:"Lead cut — the argument is the hook; comments will do the work."},{k:"ig",who:"voice home",cut:"Same beats; Story poll on ‘which method’ to farm the debate."}], test:{hyp:"Entering an argument the audience is already having drives comment volume and reach far beyond benefit-led content, and the product lands as the neutral resolution rather than a pitch.",metric:"Comment volume vs owned average; % non-follower reach; saves."}, amplify:"Cheap boost into food and cooking interests — this is a reach play, not a conversion play.", ladder:false, drove:["peak produce season makes the half-avocado problem constant right now","the wrap is the unexamined step in a step everyone argues about"], why:"Uses an argument the internet is permanently having as a free entry point, then points at the one part nobody questions. Reach content that makes the product point without ever making a claim."},
  {id:"CW-0810-1", pillar:"CW", dna:"caught-in-wild", plat:"IG + TikTok", anchor:false, world:false, panelTags:["swap","moment"], concept:"Caught in the wild: on an actual shelf, in an actual shop. The post that resolves the single most common unanswered question in the comments — where do I even buy this.", hooks:["found in the wild: an actual shelf, in an actual shop","if you’ve been meaning to try it — it’s just there, next to the foil","the ‘oh, it’s in shops’ post"], rec:1, caption:"caught in the wild 📸 on a real shelf, in a real shop, next to the things you already buy. the number of people who tell us they didn’t realise they could just… pick it up during a normal shop is genuinely high, so consider this the post that says: it’s there. no special order, no waiting for delivery, no adding one more task to the week. tag us if you spot it out in the world — Wormsley collects sightings like an extremely slow, extremely smug birdwatcher. 🪱", lead:{ch:"Instagram",who:"voice home — sightings are a community ritual and the tagging loop lives here"}, shoot:{setup:"Real in-store footage shot on a phone, deliberately unpolished. The shelf, the pick-up, the hand, the trolley. Customer-shot sightings outperform brand-shot footage every time — reposting is better than filming.", cast:"Hands + shelf + product (customer-shot strongly preferred)", tips:"VERIFY current stockists before naming any retailer — never name a shop the product isn’t actually in this week. Keep it low-production; polish kills the ‘caught in the wild’ premise entirely. Make no claims beyond availability."}, edit:{hook:"The shelf, spotted, phone-shot.", pace:"Quick, casual, real.", captions:"Minimal, conversational.", audio:"Natural store sound + a light trending bed.", overlays:"Store name only if verified; ‘tag us if you spot it’.", length:"8–14s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Shelf spotted, phone-shot, casual.",txt:"caught in the wild"},{t:"4–10s",dofilm:"Pick up, turn the pack, cert mark visible.",txt:"home-compostable · DIN CERTCO"},{t:"10–14s",dofilm:"Into the trolley. Done.",txt:"tag us if you spot it"}], channels:[{k:"ig",who:"voice home + community",cut:"Lead cut — sighting post plus a Story repost loop for customer tags."},{k:"tt",who:"reach",cut:"Quick ‘it’s actually in shops’ cut for people who assumed it was online-only."}], test:{hyp:"At-shelf sighting content converts latent intent that website content cannot, by removing the ‘where do I even buy this’ friction.",metric:"Link taps to the stockist page; volume of customer sighting tags over the following fortnight."}, amplify:"Geo-boost near verified stockists only — this is a footfall play, not a brand play.", ladder:false, drove:["retail availability is the most common unanswered question in the comments","end-of-summer shopping trips put people in these aisles right now"], why:"The cheapest conversion content the brand owns. Someone who knows they can grab it during a normal shop converts at a completely different rate from someone who has to decide to place an order."},
  {id:"CW-0810-2", pillar:"CW", dna:"caught-in-wild", plat:"TikTok + IG", anchor:false, world:false, panelTags:["swap","moment","funny"], concept:"The unpolished customer clips convert better than anything the brand can shoot — and 71% of people now say viral content has driven a purchase. So stop out-shooting the customers and start reposting them.", hooks:["the best video about our product this month wasn’t made by us","71% of people say they’ve bought something because it went viral. so.","real people, real drawers, zero production budget"], rec:0, caption:"the best thing filmed about this product this month was not filmed by us 📸 it was somebody’s slightly shaky clip, bad kitchen lighting, one hand, no script, showing the wrap actually doing its job. and it outperformed everything on our own grid. a 2026 consumer study found 71% of people have bought or seriously considered something because it went viral — and the stuff that travels is almost never the polished version. so: if you’ve filmed yours, tag us. we would genuinely rather repost you than out-produce you, and Wormsley has strong opinions about authenticity for a creature with no face. 🪱", lead:{ch:"TikTok",who:"reach — UGC-native content performs natively where UGC lives"}, shoot:{setup:"A repost-and-react format: real customer clips (with permission) stitched together, with light dry commentary. Explicitly do NOT re-shoot or re-light them — the roughness is the asset and smoothing it destroys the entire premise.", cast:"Customer footage + Wormsley reacting", tips:"Always get explicit permission and credit every creator. Never re-edit someone’s clip to look more polished. Do not add claims on top of customer footage — if a customer says something inaccurate about the cert, do not amplify that clip. Never say ‘plastic-free.’"}, edit:{hook:"A rough, real customer clip cold-opens with no branding.", pace:"Fast stitch of real clips, dry commentary over.", captions:"Creator credits on screen throughout.", audio:"Original audio from the clips where possible; light bed under.", overlays:"‘@ credit’ on each clip; ‘tag us, we’ll repost.’", length:"15–22s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Real customer clip, unbranded, rough.",txt:"not filmed by us"},{t:"5–14s",dofilm:"Two or three more, stitched, credited.",txt:"real drawers"},{t:"14–20s",dofilm:"Wormsley, approving.",txt:"tag us. we’ll repost."}], channels:[{k:"tt",who:"reach / UGC-native",cut:"Lead cut — the stitch; the roughness is the point."},{k:"ig",who:"voice home + community",cut:"Story-led repost loop with a permanent ‘tag us’ highlight."}], test:{hyp:"Reposting unpolished customer footage outperforms brand-produced content on reach and trust, and increases the volume of inbound UGC.",metric:"Reach vs brand-shot posts; count of new tagged customer clips in the following fortnight."}, amplify:"Spark-ad the best-performing customer clip with permission — always pay or credit the creator properly.", ladder:true, drove:["71% of consumers report viral content driving a purchase or consideration","unpolished UGC consistently outperforms brand production for this category"], why:"Turns the audience into the production department and converts on authenticity the brand structurally cannot manufacture. It is also the cheapest content the engine can recommend — and this week there is finally a number to justify it."},
  {id:"CW-0810-3", pillar:"CW", dna:"moment-jack", plat:"IG + TikTok", anchor:false, world:false, panelTags:["swap","moment"], concept:"The Sunday portioning cut. As the routine settles, kitchen content shifts from lunchbox aesthetics to bulk cooking, portioning and stacking — a completely different visual language, and a volume job for the roll.", hooks:["the sunday reset, but the part with the actual portioning","batch cooking season is quietly back. this is the wrap-and-stack bit.","one tray, eight portions, a very satisfying stack"], rec:0, caption:"the sunday reset is back and it looks nothing like a lunchbox 🍱 bigger trays, bulk cooking, portioning things out for the week, labelling them, and the genuinely satisfying part where they all stack. this is where the roll does volume work rather than delicate work — cover the tray, portion it down, wrap what freezes, label the lot. certified home-compostable, DIN CERTCO, roughly 12–24 weeks in a home bin once you’re done with it. no new system to adopt, no containers to buy, nothing to reorganise. just the sunday hour you were already going to spend, with one thing in it that composts afterwards.", lead:{ch:"Instagram",who:"voice home — the batch-prep audience saves and returns to this content"}, shoot:{setup:"A genuine Sunday batch-prep session: a big tray, portioning, wrapping, labelling, stacking. The visual language is bulk and order — deliberately distinct from lunchbox content. End on the satisfying stack in the fridge.", cast:"Hands + big trays + portions + labels + the roll", tips:"This is a volume-use post, not a delicate-use post — show it doing real work. No lecture. Pair with the freezer-test brief so the technique and the proof reinforce each other. Never say ‘plastic-free.’"}, edit:{hook:"A full tray hitting the counter.", pace:"Satisfying, rhythmic, ASMR-adjacent.", captions:"Portion counts; labels.", audio:"IG: satisfying/ASMR bed (pull live) · TikTok: natural sound.", overlays:"‘8 portions’; one soft ‘home-compostable · ~12–24 wks’.", length:"18–25s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Big tray down; the bulk cook.",txt:"the sunday hour"},{t:"5–15s",dofilm:"Portioning, wrapping, labelling.",txt:"portion · wrap · label"},{t:"15–22s",dofilm:"The stack going into the fridge.",txt:"the satisfying bit"},{t:"22–25s",dofilm:"Wormsley approves of the stack.",txt:"composts when you’re done"}], channels:[{k:"ig",who:"voice home + saves",cut:"Lead cut — the reset; carousel of ‘what we portioned.’"},{k:"tt",who:"reach",cut:"Faster stack-focused cut; the stack is the hook."}], test:{hyp:"Positioning the roll as a bulk, volume-use tool during batch-prep season broadens the perceived use case beyond delicate leftovers and lifts repeat purchase intent.",metric:"Saves from meal-prep audiences; whether comments mention volume or weekly use rather than one-off use."}, amplify:"Boost into meal-prep and batch-cooking interests as the season builds.", ladder:false, drove:["batch-prep and freezer season restarts as the routine settles","volume use is the repeat-purchase behaviour the brand needs to establish"], why:"Moves the product from occasional-use to weekly-habit in the customer’s mind, which is the difference between a trial purchase and a repeat one — and it rides a seasonal format shift the category hasn’t noticed yet."},
];

  {verb:"QUEUED",cls:"d-queue",t:"The health study, told conservatively",d:"Queued as the week’s hero. The Aug 7 Science Advances finding — polyethylene raising fatty-liver markers — is the strongest health hook in months and it is an ANIMAL model. It runs with the caveat given equal weight to the finding, because in the exact era when regulators are fining overclaim, under-selling your own best hook is the most persuasive move available. Everyone else will either flatten it or skip it."},

class ErrorBoundary extends React.Component{

// ---- lightweight markdown → React (ported OBSOLETE renderer) ----
function stInline(t){
  const nodes=[]; let key=0, last=0, m;
  const re=/(\*\*([^*]+)\*\*)|(\*([^*]+)\*)|(`([^`]+)`)|(\[([^\]]+)\]\(([^)]+)\))/g;
  while((m=re.exec(t))){
    if(m.index>last) nodes.push(t.slice(last,m.index));
    if(m[1]) nodes.push(<strong key={key++}>{m[2]}</strong>);
    else if(m[3]) nodes.push(<em key={key++}>{m[4]}</em>);
    else if(m[5]) nodes.push(<code key={key++}>{m[6]}</code>);
    else if(m[7]) nodes.push(<a key={key++} href={m[9]} target="_blank" rel="noopener noreferrer">{m[8]}</a>);
    last=re.lastIndex;
  }
  if(last<t.length) nodes.push(t.slice(last));
  return nodes;
}
function renderMarkdown(md){
  const lines=(md||"").split("\n"), out=[]; let i=0,key=0,list=null,lt=null;
  const flush=()=>{ if(list){ out.push(lt==="ol"?<ol key={key++}>{list}</ol>:<ul key={key++}>{list}</ul>); list=null; } };
  const special=s=>/^(#{1,3}\s|>\s?|\s*[-*]\s|\s*\d+\.\s|\s*(---|\*\*\*)\s*$)/.test(s);
  while(i<lines.length){
    const ln=lines[i];
    if(/^\s*$/.test(ln)){ flush(); i++; continue; }
    if(/^###\s+/.test(ln)){ flush(); out.push(<h4 key={key++}>{stInline(ln.replace(/^###\s+/,''))}</h4>); i++; continue; }
    if(/^#{1,2}\s+/.test(ln)){ flush(); out.push(<h3 key={key++}>{stInline(ln.replace(/^#{1,2}\s+/,''))}</h3>); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(ln)){ flush(); out.push(<hr key={key++}/>); i++; continue; }
    if(/^\s*>\s?/.test(ln)){ flush(); out.push(<blockquote key={key++}>{stInline(ln.replace(/^\s*>\s?/,''))}</blockquote>); i++; continue; }
    const om=ln.match(/^\s*\d+\.\s+(.*)/);
    if(om){ if(lt!=="ol"){flush();lt="ol";} if(!list)list=[]; list.push(<li key={key++}>{stInline(om[1])}</li>); i++; continue; }
    const um=ln.match(/^\s*[-*]\s+(.*)/);
    if(um){ if(lt!=="ul"){flush();lt="ul";} if(!list)list=[]; list.push(<li key={key++}>{stInline(um[1])}</li>); i++; continue; }
    flush(); const para=[ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !special(lines[i])){ para.push(lines[i]); i++; }
    out.push(<p key={key++}>{stInline(para.join(" "))}</p>);
  }
  flush();
  return out;
}

function Studio({seed,onClearSeed}){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const scroll=useRef(null);
  useEffect(()=>{ if(scroll.current) scroll.current.scrollTop=scroll.current.scrollHeight; },[msgs,err]);
  const ctxLabel = seed ? (seed.type==="brief" ? seed.brief.concept : seed.text) : null;
  const sugg = seed ? (seed.type==="brief"?SUGG_BRIEF:SUGG_SIGNAL) : SUGG_DEFAULT;
  async function send(text){
    const q=(text!=null?text:input).trim(); if(!q||busy) return;
    setInput(""); setErr("");
    const base=[...msgs,{role:"user",content:q}];
    setMsgs([...base,{role:"assistant",content:""}]); setBusy(true);
    try{
      const res=await fetch("/api/studio",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:base,seed})});
      if(!res.ok||!res.body) throw new Error("api");
      const rd=res.body.getReader(),dec=new TextDecoder(); let acc="";
      for(;;){ const {done,value}=await rd.read(); if(done) break; acc+=dec.decode(value,{stream:true}); setMsgs(m=>{const c=m.slice();c[c.length-1]={role:"assistant",content:acc};return c;}); }
      if(!acc.trim()) throw new Error("empty");
    }catch(e){
      setMsgs(m=>m.slice(0,-1));
      setErr("The Strategist goes live the moment this is deployed to Vercel with your ANTHROPIC_API_KEY. Running locally there’s no server to answer — but the flow, the context, and the whole engine brain are wired and ready.");
    }finally{ setBusy(false); }
  }
  function onKey(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } }
  return (
    <div className="wrap"><div className="studio">
      {seed&&<div className="st-ctx"><span className="stx-lbl">{seed.type==="brief"?"✦ Sharpening brief":"✦ Riding signal"}</span><b>{ctxLabel}</b><button className="stx-x" onClick={onClearSeed} title="clear context">×</button></div>}
      <div className="st-scroll" ref={scroll}>
        {msgs.length===0 && (
          <div className="st-empty">
            <div style={{fontSize:34}}>🧠</div>
            <h2>The Strategist</h2>
            <p>Loaded with the full Compostic engine — the dry voice, the four pillars, Wormsley &amp; Cling, and the swap panel. Ask for scripts, hooks, bits, or a gut-check.{seed?" It already has this "+(seed.type==="brief"?"brief":"signal")+" in context — just ask.":""}</p>
            <div className="st-sugg">{sugg.map((s,i)=>(<button className="st-sg" key={i} onClick={()=>send(s.q)}><span className="sgl">{s.l}</span>{s.q}</button>))}</div>
          </div>
        )}
        {msgs.map((m,i)=>(
          <div className={"msg "+(m.role==="user"?"user":"bot")} key={i}>
            <div className="msg-av">{m.role==="user"?"🌱":"🧠"}</div>
            <div className="msg-bub">{m.role==="user"?m.content:(m.content?<>{renderMarkdown(m.content)}{busy&&i===msgs.length-1&&<span className="blink"></span>}</>:<span className="blink"></span>)}</div>
          </div>
        ))}
        {err&&<div className="st-err">{err}</div>}
      </div>
      <div className="st-inputbar">
        <textarea className="st-input" rows={1} value={input} placeholder="Ask the Strategist anything…" onChange={e=>setInput(e.target.value)} onKeyDown={onKey} disabled={busy}/>
        <button className="st-send" onClick={()=>send()} disabled={busy||!input.trim()}>↑</button>
      </div>
    </div></div>
  );
}

            <h4 style={{fontSize:14,margin:'0 0 4px',color:'var(--brand)'}}>{Q.icon} {Q.q}</h4><p style={{fontSize:12.5,color:'var(--ink-soft)',margin:'0 0 12px',lineHeight:1.45}}>{Q.d}</p>
            {ans[Q.id]?.locked?(<div style={{background:'#F1FAF0',border:'1px solid var(--green)',borderRadius:10,padding:'10px 12px',fontSize:12.5}}><b style={{color:'var(--green)',fontFamily:'JetBrains Mono',fontSize:9}}>✓ LOCKED IN</b> — {ans[Q.id].value} <button style={{background:'none',border:'none',color:'var(--ink-soft)',fontSize:11,cursor:'pointer',marginLeft:6}} onClick={()=>setAns({...ans,[Q.id]:{...ans[Q.id],locked:false}})}>↺ change</button></div>):(<>
              {Q.opts.map((o,i)=>(<button key={i} onClick={()=>setAns({...ans,[Q.id]:{value:o,locked:false}})} style={{display:'block',width:'100%',textAlign:'left',background:ans[Q.id]?.value===o?'var(--accent-pale)':'var(--cream)',border:'1.5px solid '+(ans[Q.id]?.value===o?'var(--brand)':'var(--border)'),borderRadius:10,padding:'10px 12px',marginBottom:7,fontSize:12.5,cursor:'pointer',fontWeight:ans[Q.id]?.value===o?800:600,fontFamily:'Nunito'}}>{o}</button>))}
              {ans[Q.id]?.value&&<Btn style={{width:'100%',padding:9,fontSize:12,marginTop:2}} onClick={()=>setAns({...ans,[Q.id]:{...ans[Q.id],locked:true}})}>Lock it in →</Btn>}
            </>)}
          </div>))}
          <div className="card" style={{padding:16}}><div className="rail" style={{background:'var(--brand)'}}></div><h4 style={{fontSize:14,margin:'0 0 4px',color:'var(--brand)'}}>💭 Anything else?</h4><p style={{fontSize:12.5,color:'var(--ink-soft)',margin:'0 0 10px'}}>What are we missing, or reading wrong?</p>
            {freeLocked?(<div style={{background:'#F1FAF0',border:'1px solid var(--green)',borderRadius:10,padding:'10px 12px',fontSize:12.5}}><b style={{color:'var(--green)',fontFamily:'JetBrains Mono',fontSize:9}}>✓ NOTED</b> — {free} <button style={{background:'none',border:'none',color:'var(--ink-soft)',fontSize:11,cursor:'pointer',marginLeft:6}} onClick={()=>setFreeLocked(false)}>↺ edit</button></div>):(<>
              <textarea value={free} onChange={e=>setFree(e.target.value)} placeholder="Tell us where we're off…" style={{width:'100%',minHeight:70,border:'1.5px solid var(--border)',borderRadius:10,padding:10,fontFamily:'Nunito',fontSize:12.5,resize:'vertical'}}></textarea>
              {free.trim()&&<Btn style={{width:'100%',padding:9,fontSize:12,marginTop:6}} onClick={()=>setFreeLocked(true)}>Save note →</Btn>}
            </>)}
          </div>
        </div>
      </div>
    </div>
  );
}

function WIPTab({kind}){
  return (
    <div className="wrap">
      <div className="wip-banner"><span className="tag">🚧 UNDER CONSTRUCTION</span><p>A preview of what's coming once OPERATE goes live. {kind==="cal"?"A rolling content calendar with format-mix balance + amplification markers.":"Performance tracking — reach, saves, follower growth + sales — wired to your actual accounts."} Below is placeholder content so you can see the shape.</p></div>
      {kind==="cal"?(<div className="grid" style={{gridTemplateColumns:'repeat(7,1fr)',gap:8}}>{["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>(<div className="card" key={i} style={{padding:12,minHeight:130}}><div style={{fontFamily:'JetBrains Mono',fontSize:10,color:'var(--ink-soft)',marginBottom:8}}>{d}</div>{i<5&&<div style={{background:'var(--cream)',borderRadius:8,padding:'6px 8px',fontSize:10,marginBottom:5}}>{["🪱 Wormsley bit","🧾 compost reveal","🥪 health swap","💬 reply in character","📸 caught in the wild"][i]}</div>}</div>))}</div>):(<div className="kpi-grid">{["Reach","Saves","Profile visits","New followers"].map((k,i)=>(<div className="kpi" key={i}><div className="soon">SOON</div><div className="kv">—</div><div className="kl">{k}</div></div>))}</div>)}
    </div>
  );
}

function App(){
  const [nav,setNav]=useState("intel");const [memo,setMemo]=useState(true);const [brief,setBrief]=useState(null);const [diag,setDiag]=useState(false);const [studioSeed,setStudioSeed]=useState(null);const [intelFocus,setIntelFocus]=useState(null);
  const NAV=[["intel","Intelligence Brief","📡"],["briefs","Content Briefs","📝"],["studio","Studio","🧠"],["cal","Calendar","📅","wip"],["perf","Performance","📊","wip"]];
  const NAV_DESC={intel:"The trends we're watching + how to ride them",briefs:"Ready-to-shoot content ideas for your team",map:"Meet the cast — Wormsley vs Cling",studio:"Your always-on content strategist — ask it anything",how:"How the engine turns a signal into a brief",cal:"A rolling content calendar (coming soon)",perf:"Reach + follower results (coming soon)"};
  return (
    <>
      {memo&&<MondayMemo onClose={()=>setMemo(false)} onGo={()=>{setMemo(false);setNav("intel");}}/>}
      {brief&&<BriefModal b={brief} onClose={()=>setBrief(null)} onStudio={(bb)=>{setStudioSeed({type:'brief',brief:bb});setBrief(null);setNav("studio");}} onIntel={(t)=>{setBrief(null);setNav("intel");setIntelFocus(t);}}/>}
      {diag&&<DiagnosticInbox onClose={()=>setDiag(false)}/>}
      <div className="app">
        <div className="side">
          <div className="logo"><div className="logo-blocks"><div className="blk" style={{background:'var(--brand)',color:'#fff'}}>🪱</div><div className="blk" style={{background:'var(--teal)',color:'#fff'}}>🧾</div><div className="blk" style={{background:'var(--orange)',color:'#fff'}}>🥪</div></div><div className="logo-name">COMPOSTIC</div><div className="logo-sub">gone in weeks, not centuries</div></div>
          {NAV.map(n=>(<button key={n[0]} title={NAV_DESC[n[0]]} className={"nav-item"+(nav===n[0]?" on":"")} onClick={()=>setNav(n[0])}><span className="ico">{n[2]}</span>{n[1]}{n[3]==="new"&&<span className="nav-new">NEW</span>}{n[3]==="wip"&&<span className="nav-wip">WIP</span>}</button>))}
          <div className="side-spacer"></div>
          <button className="howlink" onClick={()=>setNav("how")}>⚙ how it works</button>
          <Btn onClick={()=>setDiag(true)}>📮 Diagnostic Inbox <span className="nav-wip" style={{marginLeft:6}}>WIP</span></Btn>
        </div>
        <div className="main">
          <div className="page-head">
            <div><h1>{ {intel:"Intelligence Brief",briefs:"Content Briefs",map:"The Cast",studio:"Studio",how:"How It Works",cal:"Calendar",perf:"Performance"}[nav] }</h1>
              <p className="dek">{ {intel:"What’s moving in sustainable-home + plastic-free culture this week — and exactly how Compostic could ride each one.",briefs:"Ready-to-shoot content ideas, built from the signals on the left. Click any card to open the full brief.",map:"Wormsley vs Cling — the character duo, the content engine no competitor has.",studio:"Your always-on content strategist, loaded with the full engine context.",how:"One signal, start to finish — how a trend we spot becomes next week’s post.",cal:"A rolling content calendar (coming once we’re working together).",perf:"Reach, saves, and follower results (coming once we’re working together)."}[nav] }</p>
            </div>
            <div className="pill"><span className="live-dot"></span>Live · {WEEK}</div>
          </div>
          {!memo&&nav==="intel"&&(<div className="ticker"><div className="ticker-track">{[...TICKER,...TICKER].map((t,i)=>(<span key={i}><span className="tdot" style={{background:{signal:'var(--brand-mid)',pulse:'var(--coral)',decision:'var(--accent)',win:'var(--green)',warn:'var(--warn)'}[t[0]]}}></span>{t[1]}</span>))}</div></div>)}
          {nav==="intel"&&<IntelBrief focus={intelFocus} onFocusDone={()=>setIntelFocus(null)} onDrop={(txt)=>{setStudioSeed(txt?{type:'signal',text:txt}:null);setNav("studio");}} onOpen={setBrief}/>}
          {nav==="briefs"&&<ContentBriefs onOpen={setBrief}/>}
          {nav==="studio"&&<Studio seed={studioSeed} onClearSeed={()=>setStudioSeed(null)}/>}
          {nav==="how"&&<HowItWorks/>}
          {nav==="cal"&&<WIPTab kind="cal"/>}
          {nav==="perf"&&<WIPTab kind="perf"/>}
          <div className="foot"><b>Compostic Engine</b> · {WEEK} · built for Compostic · public-signal read · OBSOLETE V0.4</div>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
