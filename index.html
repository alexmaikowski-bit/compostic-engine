<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compostic — Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root{
    --brand:#3E7B54; --brand-deep:#2E5C3F; --brand-light:#E4EFE2; --brand-mid:#4E9E8A;
    --magenta:#3E7B54; --purple:#4E9E8A; --purple-deep:#2E5C3F; --orange:#E8944A;
    --accent:#E8944A; --accent-soft:#F3C79B; --accent-deep:#B5641E; --accent-pale:#FBEBD9;
    --cream:#F4F1E9; --cream-deep:#E9E4D6; --paper:#FFFFFF;
    --ink:#25291F; --ink-soft:#5F6657; --border:#E4E0D2;
    --coral:#E8944A; --teal:#4E9E8A; --pink:#4E9E8A; --green:#3E7B54; --green-deep:#2E5C3F;
    --hi:#3E7B54; --warn:#C77A2E;
    --shadow:0 2px 10px rgba(37,41,31,.08); --shadow-lg:0 16px 46px rgba(37,41,31,.18);
    --hard:4px 4px 0 var(--brand-deep); --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3,h4{font-family:'Quicksand','Quicksand','Nunito',sans-serif}
  a{color:inherit}
  ::selection{background:var(--accent);color:var(--brand-deep)}

  .app{display:grid;grid-template-columns:214px 1fr;min-height:100vh}

  /* Sidebar */
  .side{background:var(--brand-deep);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .logo{margin-bottom:16px}
  .logo-blocks{display:flex;gap:3px;margin-bottom:7px}
  .blk{width:27px;height:27px;border-radius:6px;display:grid;place-items:center;font-family:'Quicksand';font-weight:900;font-size:15px;color:var(--brand-deep);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .logo-name{font-family:'Quicksand';font-weight:900;font-size:18px;letter-spacing:.01em;line-height:1;color:#fff}
  .logo-sub{font-size:10px;color:var(--accent);font-style:italic;font-family:'Fraunces';margin-top:3px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:700;color:#C9BEE8;transition:.15s;border:none;background:none;text-align:left;width:100%;font-family:'Nunito'}
  .nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
  .nav-item.on{background:var(--brand);color:#fff}
  .nav-item .ico{font-size:15px}
  .nav-new{font-size:8px;background:var(--accent);color:var(--brand-deep);padding:1px 6px;border-radius:20px;margin-left:auto;letter-spacing:.04em;font-weight:800}
  .nav-wip{font-size:8px;background:rgba(255,255,255,.15);padding:1px 6px;border-radius:20px;margin-left:auto;letter-spacing:.05em}
  .side-spacer{flex:1;min-height:14px}
  .btn-chunky{background:var(--accent-soft);color:var(--brand-deep);border:2px solid var(--brand-deep);padding:11px;border-radius:14px;font-weight:800;font-size:13px;cursor:pointer;font-family:'Quicksand';display:flex;align-items:center;gap:7px;justify-content:center;box-shadow:3px 3px 0 var(--brand-deep);transition:.12s}
  .btn-chunky:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--brand-deep)}
  .btn-chunky:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--brand-deep)}
  .howlink{background:none;border:none;color:#9385C4;font-size:11px;cursor:pointer;padding:8px;text-align:center;font-weight:700}
  .howlink:hover{color:#fff}

  /* Main */
  .main{padding:0 0 60px;min-width:0}
  .page-head{padding:26px 34px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .page-head h1{font-size:32px;font-weight:900;margin:0 0 4px;letter-spacing:-.01em;color:var(--brand)}
  .page-head .dek{font-family:'Fraunces';font-style:italic;font-size:15px;color:var(--ink-soft);margin:0;max-width:660px;line-height:1.4}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-pale);border:1.5px solid var(--brand);padding:6px 13px;border-radius:30px;font-size:11.5px;font-weight:800;white-space:nowrap;color:var(--brand)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--hi);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,167,109,.5)}70%{box-shadow:0 0 0 7px rgba(58,167,109,0)}100%{box-shadow:0 0 0 0 rgba(58,167,109,0)}}

  .ticker{background:var(--brand-deep);color:#fff;overflow:hidden;white-space:nowrap;padding:9px 0;margin:0 0 18px}
  .ticker-track{display:inline-block;animation:scroll 72s linear infinite}
  .ticker-track span{margin:0 15px;font-size:11.5px;font-family:'JetBrains Mono'}
  .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  .wrap{padding:0 34px}
  .section-eyebrow{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;margin:26px 0 12px;font-weight:700}

  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 20px}
  .subtab{background:var(--paper);border:1.5px solid var(--border);padding:8px 14px;border-radius:30px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--ink-soft);transition:.15s;font-family:'Nunito'}
  .subtab:hover{border-color:var(--brand)}
  .subtab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .subtab .badge{background:rgba(0,0,0,.12);border-radius:20px;padding:0 6px;font-size:10px;font-weight:800}
  .subtab.on .badge{background:rgba(255,255,255,.25)}

  .grid{display:grid;gap:14px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}

  .card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px 16px 14px;position:relative;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .card .rail{position:absolute;left:0;top:0;bottom:0;width:5px}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .glyph{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .eyebrow{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
  .vbadge{margin-left:auto;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;font-family:'JetBrains Mono';letter-spacing:.03em}
  .vhigh{background:#FDECEA;color:#C0392B}.vmed{background:#FDF3DA;color:#B9791B}.vlow{background:#EFEDE7;color:#8A8175}
  .card h3{font-family:'Fraunces';font-size:16px;font-weight:600;margin:0 0 7px;line-height:1.28}
  .card p.detail{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 10px}
  .playbox{background:var(--brand-light);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:12.5px;line-height:1.45}
  .playbox .plabel{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:700;display:block;margin-bottom:3px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
  .chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--cream-deep);color:var(--ink-soft)}
  .chip.brand{background:var(--brand-light);color:var(--brand)}
  .chip.plat{background:var(--accent-pale);color:var(--accent-deep)}
  .srcchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .src{font-family:'JetBrains Mono';font-size:9.5px;color:var(--ink-soft);background:var(--cream);border:1px solid var(--border);padding:2px 7px;border-radius:6px;text-decoration:none}
  .src:hover{border-color:var(--brand);color:var(--brand)}
  .dropbtn{margin-left:auto;background:var(--accent-soft);color:var(--brand-deep);border:1.5px solid var(--brand-deep);font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:20px;cursor:pointer;font-family:'Quicksand';box-shadow:2px 2px 0 var(--brand-deep)}
  .dropbtn:hover{transform:translate(-1px,-1px)}
  .brief-link{display:flex;align-items:center;gap:6px;background:var(--accent-pale);border:1px solid var(--accent-deep);color:var(--brand-deep);border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer;margin-top:10px;font-family:'Nunito';text-align:left;line-height:1.35;width:100%}
  .brief-link:hover{background:var(--accent-soft)}
  .brief-link .bl-arrow{font-family:'JetBrains Mono';flex-shrink:0}
  .pips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .pip{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.01em;display:inline-flex;align-items:center;gap:3px}
  .read-hint{background:var(--brand-light);border:1px solid #DBCEF4;border-radius:13px;padding:11px 15px;font-size:12px;line-height:1.55;color:var(--ink-soft);margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
  .read-hint b{color:var(--brand);font-weight:800}
  .read-hint .rh-ico{font-size:15px;flex-shrink:0;line-height:1.3}
  .rh-list{margin:6px 0 0;padding-left:17px}
  .rh-list li{margin:3px 0;line-height:1.45}
  .drove-wrap{margin-top:11px;padding-top:11px;border-top:1px dashed var(--border)}
  .drove-lbl{display:block;font-family:'JetBrains Mono';font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;margin-bottom:7px}
  .drove-chips{display:flex;flex-direction:column;gap:6px}
  .drove-chip{text-align:left;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.35;color:var(--ink);font-family:'Nunito';cursor:pointer;transition:.12s;font-weight:600}
  .drove-chip:hover{border-color:var(--brand);background:var(--brand-light);color:var(--brand)}
  .drove-chip.static{cursor:default;color:var(--ink-soft);font-weight:600}
  .drove-chip.static:hover{border-color:var(--border);background:var(--paper);color:var(--ink-soft)}
  .card.flash{animation:cardflash 1.7s ease-out}
  @keyframes cardflash{0%{box-shadow:0 0 0 3px var(--accent)}18%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
  .step-cell{transition:background .4s ease,box-shadow .4s ease}
  .step-cell.on{box-shadow:inset 0 0 0 2px var(--accent)}
  .step-cell.you.on{box-shadow:inset 0 0 0 2px var(--accent-soft)}
  .lnow{color:var(--green);font-weight:800;white-space:nowrap}
  .ltail{color:var(--accent-deep);font-weight:800;white-space:nowrap}
  .cast-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .cast-mini{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
  .cast-mini .cem{font-size:27px;line-height:1;flex-shrink:0}
  .cast-mini .crl{font-size:9.5px;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
  .cast-mini .cnm{font-family:'Quicksand';font-weight:800;font-size:14px;line-height:1}
  .cast-mini .cln{font-family:'Fraunces';font-style:italic;font-size:11px;color:var(--ink-soft);line-height:1.35;margin-top:4px}
  @media(max-width:860px){.cast-strip{grid-template-columns:1fr 1fr}}
  .cardfoot{display:flex;align-items:flex-end;gap:8px;margin-top:11px}
  .cardfoot .srcchips{flex:1;margin-top:0}
  .ch-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .ch-right .vbadge{margin-left:0}
  .fresh-chip{font-size:8.5px;font-weight:800;padding:2px 8px;border-radius:20px;font-family:'JetBrains Mono';letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .fc-fresh{background:#E7F5EC;color:#2E8B57}
  .fc-comp{background:var(--accent-pale);color:var(--accent-deep)}
  .dir-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;font-family:'JetBrains Mono'}
  .dir-hot{background:#FDECEA;color:#C0392B}.dir-cool{background:#E7F5EC;color:#2E8B57}.dir-flat{background:#EFEDE7;color:#8A8175}

  .mom-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .mom-col{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .mom-col h4{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:7px;color:var(--brand)}
  .mom-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px;line-height:1.4}
  .mom-item:last-child{border-bottom:none}
  .mchip{font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:20px;height:fit-content;white-space:nowrap;font-family:'JetBrains Mono'}
  .mup{background:#E7F5EC;color:#2E8B57}.mdown{background:#FDF3DA;color:#B9791B}

  /* Hero band */
  .ride-hero{background:linear-gradient(120deg,var(--brand-deep),var(--brand) 62%,var(--brand-mid));color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
  .ride-count{background:var(--accent);color:var(--brand-deep);font-family:'Quicksand';font-weight:900;font-size:15px;padding:8px 15px;border-radius:30px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .ride-hero h2{font-size:20px;margin:0 0 3px;font-weight:900}
  .ride-hero p{margin:0;font-size:12.5px;color:#E4DBF7}
  .ride-meta{margin-left:auto;text-align:right;font-size:11px;color:#CFC2EE;font-family:'JetBrains Mono'}

  .pillar-head{display:flex;align-items:center;gap:9px;margin:22px 0 12px}
  .pillar-sw{width:16px;height:16px;border-radius:6px}
  .pillar-head h3{font-size:18px;font-weight:800;margin:0;color:var(--brand)}
  .pillar-head .ct{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono';margin-left:auto}

  .brief{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column}
  .brief:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .brief .rail{position:absolute;left:0;top:0;bottom:0;width:5px}
  .brief-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .conv{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;font-family:'JetBrains Mono';cursor:help;position:relative}
  .cHIGH{background:#E7F5EC;color:#2E8B57}.cMEDIUM{background:#FDF3DA;color:#B9791B}.cWATCH{background:#EFEDE7;color:#8A8175}
  .brief h4{font-family:'Fraunces';font-size:14px;font-weight:600;line-height:1.32;margin:0 0 11px;flex:1}
  .brief-bottom{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .nobaby{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:#E5F6FA;color:var(--teal);font-family:'JetBrains Mono'}
  .anchor-tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--accent-pale);color:var(--accent-deep);font-family:'JetBrains Mono'}
  .tip{position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px;border-radius:10px;font-size:11px;font-weight:600;width:214px;z-index:40;box-shadow:var(--shadow-lg);font-family:'Nunito';line-height:1.5;display:none}
  .conv:hover .tip{display:block}
  .tip b{color:var(--accent)}

  /* Casting meter */
  .meter-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .meter-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .meter-top h3{font-size:16px;margin:0;color:var(--brand)}
  .meter-bar{height:26px;border-radius:14px;background:var(--cream-deep);overflow:hidden;display:flex;margin:12px 0 8px;border:1px solid var(--border)}
  .meter-fill{background:linear-gradient(90deg,var(--teal),#3bbcd8);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11px;font-weight:800;color:#fff;font-family:'JetBrains Mono'}
  .meter-rest{flex:1;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:700;color:var(--ink-soft);font-family:'JetBrains Mono'}
  .meter-legend{display:flex;gap:18px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap}
  .meter-legend b{color:var(--ink)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(28,20,48,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal{background:var(--cream);border-radius:22px;max-width:680px;width:100%;box-shadow:var(--shadow-lg);position:relative;margin-bottom:40px;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .modal-hero{background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff;padding:24px 28px;border-radius:22px 22px 0 0;position:relative}
  .x{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.16);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1}
  .x:hover{background:rgba(255,255,255,.3)}
  .modal-body{padding:22px 28px 28px}
  .m-sec{margin-bottom:20px}
  .m-sec-label{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .hookrow{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.4;position:relative}
  .hookrow.rec{border-color:var(--green);background:#F3FAF0}
  .rec-tag{font-size:8.5px;font-weight:800;color:var(--green);font-family:'JetBrains Mono';letter-spacing:.08em;position:absolute;top:8px;right:11px}
  .intel-row{display:flex;gap:9px;align-items:flex-start;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:12.5px;line-height:1.4}
  .capvar{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px}
  .capvar .cvlabel{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:5px;display:flex;justify-content:space-between}
  .capvar p{margin:0;font-size:13px;line-height:1.5}
  .copybtn{background:var(--cream-deep);border:none;font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;cursor:pointer;font-family:'JetBrains Mono';color:var(--ink-soft)}
  /* ===== Production Map ===== */
  .prod-lead{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
  .prod-lead b{color:var(--brand)}
  .prod-block{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:11px}
  .prod-h{font-family:'Nunito';font-weight:900;font-size:14px;color:var(--brand);display:flex;align-items:center;gap:7px;margin-bottom:11px}
  .prod-h .ph-tags{margin-left:auto;display:flex;gap:6px}
  .prod-meta{font-size:12.5px;line-height:1.5;margin-bottom:8px}
  .prod-meta:last-child{margin-bottom:0}
  .pm-k{display:inline-block;font-family:'JetBrains Mono';font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;background:var(--cream-deep);padding:2px 7px;border-radius:20px;margin-right:8px;vertical-align:middle}
  .prod-tip{background:var(--brand-light);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.45;color:var(--ink);margin-top:11px}

  .chan-row{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--border)}

  .chan-badge{font-size:19px;flex-shrink:0;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
  .chan-fb{background:#E7F0FA}.chan-ig{background:var(--brand-light)}.chan-tt{background:var(--cream-deep)}
  .chan-who{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.04em;font-weight:800;color:var(--brand);text-transform:uppercase;margin-bottom:2px}
  .chan-cut{font-size:12px;line-height:1.45;color:var(--ink)}
  .exp-tag{font-family:'JetBrains Mono';font-size:8px;font-weight:800;letter-spacing:.06em;color:var(--accent-deep);background:var(--accent-pale);border:1px solid var(--accent);padding:2px 8px;border-radius:20px}
  .proven-tag{font-family:'JetBrains Mono';font-size:8px;font-weight:800;letter-spacing:.06em;color:#2E8B57;background:#E7F5EC;border:1px solid var(--green);padding:2px 8px;border-radius:20px}
  .exp-box{background:var(--accent-pale);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:9px}
  .exp-box .prod-meta:last-child{margin-bottom:0}
  .panel-chan{font-family:'JetBrains Mono';font-size:8px;font-weight:800;letter-spacing:.04em;color:var(--brand);background:var(--brand-light);padding:2px 7px;border-radius:20px}
  /* ===== weekly dashboard modules ===== */
  .chan-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:20px}
  .chan-pb{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:14px 15px}
  .chan-pb .cc-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .cc-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .cc-plat{font-family:'Quicksand';font-weight:800;font-size:15px;color:var(--brand);line-height:1}
  .cc-who{font-family:'JetBrains Mono';font-size:8.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase;margin-top:3px}
  .cc-job{font-size:12px;line-height:1.45;color:var(--ink);margin-bottom:9px}
  .cc-lead{font-family:'JetBrains Mono';font-size:9px;font-weight:800;letter-spacing:.03em;color:var(--accent-deep);background:var(--accent-pale);padding:4px 9px;border-radius:20px;display:inline-block}
  .wk-mod{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:15px 16px}
  .wk-h{font-family:'Quicksand';font-weight:800;font-size:15px;color:var(--brand);display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .wk-ct{font-family:'JetBrains Mono';font-size:10px;font-weight:800;color:var(--accent-deep);background:var(--accent-pale);padding:1px 8px;border-radius:20px}

  /* ===== turnkey 'auto-produce' teaser ===== */
  .produce-teaser{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,var(--brand-light),var(--accent-pale));border:1px dashed var(--brand-mid);border-radius:12px;padding:13px 15px;margin-top:12px}

  .soon-pill{font-family:'JetBrains Mono';font-size:8px;font-weight:800;letter-spacing:.08em;color:var(--brand);background:#fff;border:1px solid var(--brand-mid);padding:2px 7px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .produce-teaser .pt-sub{font-size:11.5px;color:var(--ink-soft);line-height:1.45;margin-top:4px}
  /* phone shot list */
  .phone-row{display:flex;gap:11px;overflow-x:auto;padding-bottom:6px}
  .phone{min-width:174px;width:174px;height:304px;background:var(--ink);border-radius:20px;padding:6px;flex-shrink:0;position:relative}
  .phone-screen{background:linear-gradient(165deg,var(--brand-light),#fff);border-radius:15px;height:100%;padding:11px 11px 10px;display:flex;flex-direction:column}
  .phone-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .phone-scene{font-family:'JetBrains Mono';font-size:8.5px;color:var(--brand);font-weight:800;letter-spacing:.06em}
  .phone-sec{font-family:'JetBrains Mono';font-size:8px;color:var(--ink-soft);font-weight:700;background:var(--cream-deep);padding:1px 6px;border-radius:20px}
  .phone-do{font-size:11px;line-height:1.42;color:var(--ink);font-weight:600}

  .phone-osd .osl{display:block;font-family:'JetBrains Mono';font-size:7px;letter-spacing:.1em;opacity:.7;margin-bottom:2px;font-weight:800}
  .phone-cap{margin-top:auto;padding-top:8px;font-size:8px;color:var(--ink-soft);line-height:1.3;font-family:'JetBrains Mono'}
  .words-sub{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:7px}
  .panel-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap}
  .panel-note{font-size:11.5px;color:var(--ink-soft);font-style:italic;font-family:'Fraunces';line-height:1.4;flex:1;min-width:170px}
  .panel-run{background:var(--brand);color:#fff;border:none;font-family:'JetBrains Mono';font-size:10px;font-weight:800;letter-spacing:.04em;padding:7px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
  .panel-run:disabled{opacity:.55;cursor:default}
  .panel-live-badge{font-family:'JetBrains Mono';font-size:8px;font-weight:800;letter-spacing:.08em;color:var(--green);background:#F3FAF0;border:1px solid var(--green);padding:3px 8px;border-radius:20px}
  .panel-share{margin-left:auto;font-family:'JetBrains Mono';font-size:8px;color:var(--ink-soft);font-weight:700}
  /* panel */
  .panel-react{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}

  .panel-score{margin-left:auto;font-family:'JetBrains Mono';font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}
  .panel-line{font-size:12px;color:var(--ink-soft);font-style:italic;font-family:'Fraunces';line-height:1.4;margin-top:2px}
  details.acc{background:var(--paper);border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden}

  .acc-body{padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--ink-soft)}
  .chev{margin-left:auto;transition:.2s}
  details.acc[open] .chev{transform:rotate(180deg)}

  /* Performance chart */
  .perf-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
  .perf-card h3{font-size:19px;margin:0 0 3px;color:var(--brand)}
  .perf-card .sub{font-family:'Fraunces';font-style:italic;color:var(--ink-soft);font-size:13.5px;margin-bottom:18px}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .bar-label{width:190px;font-size:11.5px;font-weight:700;text-align:right;flex-shrink:0;line-height:1.25}
  .bar-track{flex:1;height:22px;background:var(--cream);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:0 6px 6px 0;min-width:4px}
  .bar-val{width:52px;flex-shrink:0;font-family:'JetBrains Mono';font-size:11.5px;font-weight:800;white-space:nowrap;text-align:left}
  .perf-legend{display:flex;gap:20px;margin:16px 0 4px;font-size:12px;font-weight:700}
  .perf-legend span{display:flex;align-items:center;gap:6px}
  .sw{width:13px;height:13px;border-radius:4px}
  .perf-punch{background:var(--brand-light);border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:16px}
  .funnel{display:flex;align-items:center;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
  .fstep{flex:1;min-width:130px;background:var(--cream);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center}
  .fstep .fnum{font-family:'Quicksand';font-weight:900;font-size:27px;line-height:1}
  .fstep .flbl{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.3}
  .farrow{font-family:'JetBrains Mono';font-size:15px;color:var(--ink-soft);flex-shrink:0}
  @media(max-width:600px){.funnel{flex-direction:column}.farrow{transform:rotate(90deg)}}

  /* Milestone Map */
  .mm-bands{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .mm-band{flex:1;min-width:130px;background:var(--paper);border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;text-align:center}
  .mm-band:hover{border-color:var(--brand-mid)}
  .mm-band.on{border-color:var(--brand);background:var(--brand-light)}
  .mm-band .age{font-family:'Quicksand';font-weight:900;font-size:17px;color:var(--brand)}
  .mm-band .lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:2px}
  .mm-detail{background:var(--paper);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .mm-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
  .mm-step{background:var(--paper);padding:16px}
  .mm-step:last-child{background:var(--brand-light)}
  .mm-step .mstage{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.1em;color:var(--ink-soft);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .mm-step h4{font-size:14px;margin:0 0 6px;color:var(--brand)}
  .mm-step p{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:0}
  .mm-cta{padding:14px 18px;background:var(--brand-deep);color:#fff;font-size:12.5px;display:flex;align-items:center;gap:10px}

  /* how it works */
  .flow-rail{display:flex;align-items:center;gap:0;margin:20px 0;overflow-x:auto;padding-bottom:6px}
  .flow-node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex-shrink:0;cursor:pointer;border:2px solid var(--border);background:var(--paper);transition:.25s}
  .flow-node.done{background:var(--brand);border-color:var(--brand);color:#fff}
  .flow-node.active{background:var(--accent);border-color:var(--accent-deep);transform:scale(1.18);box-shadow:0 0 0 5px rgba(246,217,59,.3)}
  .flow-line{height:3px;width:26px;background:var(--border);flex-shrink:0}
  .flow-line.fill{background:var(--brand)}
  .flow-card{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
  .fc-agent{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .fc-agent .g{width:40px;height:40px;border-radius:12px;background:var(--brand-light);display:grid;place-items:center;font-size:18px}
  .watch-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .watch-chip{font-size:10px;background:var(--cream);border:1px solid var(--border);padding:3px 9px;border-radius:20px;font-family:'JetBrains Mono';color:var(--ink-soft)}
  .verdict{background:#F1FAF0;border:1px solid #BFE3CD;border-radius:11px;padding:11px 13px;font-size:12.5px;margin-top:12px;line-height:1.5}
  .incoming{font-size:10px;font-family:'JetBrains Mono';color:var(--ink-soft);background:var(--cream);padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:8px}
  .step-band{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:18px 0}
  .step-cell{background:var(--paper);padding:16px}
  .step-cell.you{background:var(--brand-deep);color:#fff}
  .step-num{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-soft);border-bottom:1px dashed var(--border);padding-bottom:5px;margin-bottom:8px}
  .step-cell.you .step-num{color:#C9BEE8;border-color:rgba(255,255,255,.2)}
  .step-cell h4{font-size:15px;margin:0 0 5px;color:var(--brand)}
  .step-cell.you h4{color:#fff}
  .step-cell p{font-size:11.5px;color:var(--ink-soft);margin:0;line-height:1.45}
  .step-cell.you p{color:#E4DBF7}

  .wip-banner{background:repeating-linear-gradient(45deg,var(--accent-pale),var(--accent-pale) 10px,#FBF0C4 10px,#FBF0C4 20px);border:1.5px dashed var(--accent-deep);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .wip-banner .tag{font-family:'JetBrains Mono';font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--brand);background:#fff;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:8px}
  .wip-banner p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
  .kpi{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative;overflow:hidden;text-align:center}
  .kpi .soon{position:absolute;inset:0;display:grid;place-items:center;font-family:'Quicksand';font-size:34px;font-weight:900;color:rgba(74,30,158,.06)}
  .kpi .kv{font-family:'Quicksand';font-size:26px;font-weight:900;color:var(--ink-soft);position:relative}
  .kpi .kl{font-size:10.5px;color:var(--ink-soft);position:relative;margin-top:3px}
  .foot{text-align:center;padding:30px;font-family:'JetBrains Mono';font-size:10px;color:var(--ink-soft);margin-top:20px}
  .decision-row{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .dverb{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;font-family:'JetBrains Mono';white-space:nowrap;height:fit-content}
  .d-prom{background:#E7F5EC;color:#2E8B57}.d-kill{background:#FDECEA;color:#C0392B}.d-queue{background:var(--brand-light);color:var(--brand)}.d-esc{background:#FDF3DA;color:#B9791B}

  .amb-card{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden}
  .amb-card .rail{position:absolute;left:0;top:0;bottom:0;width:5px}
  .amb-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .amb-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--teal));display:grid;place-items:center;color:#fff;font-family:'Quicksand';font-weight:900;font-size:15px}
  .amb-handle{font-weight:800;font-size:13px}
  .amb-name{font-size:11px;color:var(--ink-soft)}
  .status-pill{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;font-family:'JetBrains Mono';margin-left:auto}
  .st-watch{background:var(--accent-pale);color:var(--accent-deep)}

  .studio-teaser{background:linear-gradient(135deg,var(--brand-deep),var(--brand));border-radius:20px;padding:34px;color:#fff;text-align:center}
  .studio-teaser h2{font-size:26px;margin:12px 0 8px;font-weight:900}
  .studio-teaser p{font-size:13.5px;color:#E4DBF7;max-width:520px;margin:0 auto 18px;line-height:1.55}
  .st-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:560px;margin:0 auto}
  .st-c{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;text-align:left;font-size:12.5px}
  .st-c .stq{font-family:'Fraunces';font-style:italic}
  /* Studio chat */
  .studio{display:flex;flex-direction:column;height:calc(100vh - 176px);min-height:440px;background:var(--paper);border:1px solid var(--border);border-radius:18px;overflow:hidden}
  .st-ctx{background:linear-gradient(120deg,var(--brand-deep),var(--brand));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:11px;font-size:12.5px}
  .st-ctx .stx-lbl{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.1em;opacity:.85;text-transform:uppercase;white-space:nowrap}
  .st-ctx b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-ctx .stx-x{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0}
  .st-scroll{flex:1;overflow-y:auto;padding:22px}
  .st-empty{max-width:580px;margin:5vh auto 0;text-align:center}
  .st-empty h2{font-size:24px;font-weight:900;margin:10px 0 6px}
  .st-empty p{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0 auto 20px;max-width:470px}
  .st-sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:580px;margin:0 auto}
  .st-sg{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 13px;text-align:left;cursor:pointer;font-size:12.5px;line-height:1.4;color:var(--ink);transition:.12s}
  .st-sg:hover{border-color:var(--brand);background:var(--brand-light)}
  .st-sg .sgl{display:block;font-family:'JetBrains Mono';font-size:8px;letter-spacing:.08em;color:var(--brand);margin-bottom:4px;font-weight:800}
  .msg{display:flex;gap:10px;margin-bottom:16px;max-width:780px}
  .msg.user{margin-left:auto;flex-direction:row-reverse}
  .msg-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .msg.user .msg-av{background:var(--purple);color:#fff}
  .msg.bot .msg-av{background:var(--brand);color:#fff}
  .msg-bub{border-radius:14px;padding:11px 15px;font-size:13.5px;line-height:1.6}
  .msg.user .msg-bub{background:var(--purple);color:#fff}
  .msg.bot .msg-bub{background:#fff;border:1px solid var(--border);color:var(--ink)}
  .msg-bub p{margin:0 0 9px} .msg-bub p:last-child{margin-bottom:0}
  .msg-bub h3{font-size:14.5px;font-weight:800;margin:12px 0 6px} .msg-bub h3:first-child{margin-top:0}
  .msg-bub h4{font-size:13px;font-weight:800;margin:10px 0 5px}
  .msg-bub ul,.msg-bub ol{margin:4px 0 9px;padding-left:20px} .msg-bub li{margin-bottom:4px}
  .msg-bub code{background:var(--cream-deep);padding:1px 5px;border-radius:5px;font-size:12px;font-family:'JetBrains Mono'}
  .msg-bub blockquote{border-left:3px solid var(--brand);margin:6px 0;padding:2px 0 2px 12px;color:var(--ink-soft);font-style:italic}
  .msg-bub hr{border:none;border-top:1px solid var(--border);margin:10px 0}
  .msg-bub a{color:var(--brand);font-weight:700}

{id:"FG-0803-1", amp:{headline:"The lunchbox week", why:"Back-to-school restock is the highest-intent window of the second half for a product used daily in a kid’s lunch. Put the money behind the swap inside the ritual, not behind the frightening number.", budget:150, window:"Aug 3 – 12 (concentrate through the first restock weekend)", objective:"Saves + link taps from parents mid-restock", guardrail:"Lead with the swap, never the statistic. No fear-farming, no distressed children, no implication a parent has poisoned anyone. Wormsley stays dry.", placements:[{platform:"Instagram", format:"Reel + Story link", budget:90, reach:"Warm + parent lookalikes", audience:"Back-to-school, lunchbox, low-tox parenting", note:"Where the pack-my-lunch audience lives."},{platform:"TikTok", format:"In-feed Spark Ad", budget:60, reach:"Cold reach", audience:"packmylunch / bento / kitchen-swap interests", note:"Ride the native ritual format; no brand-forward cut."}]}, pillar:"FG", dna:"health-swap", plat:"IG + TikTok", anchor:true, world:true, panelTags:["health","proof","swap"], concept:"Pack-my-lunch, shot as the ritual people already watch — except the hand reaches for the compostable roll. The 2026 exposure number lands once, quietly, after the swap. The wrap is not an ingredient.", hooks:["packing a lunch is about eight decisions. this is the one nobody audits.","you read the cereal box. you never read the wrap.","the wrap is not an ingredient. it just acts like one."], rec:1, caption:"everybody audits what goes IN the lunchbox 🪱 nobody audits what goes around it. a 2026 study measured microplastics in wrapped food and put early-childhood exposure at roughly 24 particles per kilo of bodyweight a day — most of it fibre. we are not here to ruin your morning. the box is fine. the sandwich is fine. it is just the one layer nobody thought to check, and it is the easiest thing in the whole routine to change. one roll. same drawer. that is the entire ask.", lead:{ch:"Instagram",who:"parents mid-restock — the pack-my-lunch audience lives here"}, shoot:{setup:"Straight-down pack-my-lunch: hands only, real kitchen, a lunchbox filling in real time. Sandwich gets wrapped — the reach for the roll is the hero beat, held half a second longer than the rest. Warm morning light, no studio.", cast:"Hands only — no face, no child on camera, no founder needed", tips:"Do NOT lead with the statistic and do NOT show a child. The number appears once as a card AFTER the swap, stated flatly with the source on screen. If the cut feels like a warning, recut it as a routine."}, edit:{hook:"Hands packing; the reach for the roll held one beat long.", pace:"Calm, ASMR-adjacent — let the sounds carry it.", captions:"One dry line at a time. No exclamation marks.", audio:"IG: soft ASMR / kitchen-native sound · TikTok: pull a live pack-my-lunch trend sound.", overlays:"‘~24 microplastic particles per kg bodyweight / day (2026 study)’ card at 8s, source visible. End card: the roll.", length:"15–20s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Hands assembling a lunchbox, straight down. Ordinary morning.",txt:"eight decisions before 8am."},{t:"4–9s",dofilm:"The reach for the roll — held. Sandwich wrapped, clean.",txt:"this is the one nobody audits."},{t:"9–14s",dofilm:"Card: the exposure number, stated flatly, source on screen.",txt:"~24 particles per kg. a day."},{t:"14–20s",dofilm:"Lid closes. Roll back in the drawer. No flourish.",txt:"same drawer. one swap."}], channels:[{k:"ig",who:"parents mid-restock",cut:"Lead cut — the full ritual Reel + a Story with the swap link, pinned through restock fortnight."},{k:"tt",who:"reach / new eyes",cut:"Faster, trend-sound-led; the number card lands two seconds earlier."}], test:{hyp:"Leading with the ritual and burying the statistic converts better than leading with the microplastics number — this audience arrives already convinced and wants the replacement, not the case.",metric:">3× owned-post average on saves; watch comment sentiment for any fear-mongering read and kill that cut if it appears."}, amplify:"Hero paid: concentrate through the first restock weekend against back-to-school and low-tox parenting interests.", ladder:true, drove:["A 2026 study put early-childhood exposure at ~24 microplastic particles per kg bodyweight a day","pack-my-lunch is the most-watched kitchen ritual of the season"], why:"Puts the product inside the exact frame the season is already filming, with the hardest proof the brand has ever had sitting quietly underneath instead of shouting over it."},

{id:"RC-0803-1", amp:{headline:"Aug 12 — the rules move", why:"A dated, checkable regulatory beat nine days out gives the Receipts pillar a real news peg and lets the certification stand next to it.", budget:80, window:"Aug 10 – 14", objective:"Reach + saves on the certification story", guardrail:"No victory lap, no we-told-you-so, no rival named. One flat line and the certificate.", placements:[{platform:"Instagram", format:"Carousel", budget:50, reach:"Warm + eco-curious", audience:"Sustainable swaps, low-tox, packaging-aware", note:"Carousel suits the receipts format."},{platform:"TikTok", format:"In-feed", budget:30, reach:"Cold", audience:"Climate + policy-curious", note:"Bulletin register; dry delivery."}]}, pillar:"RC", dna:"good-sht-bulletin", plat:"IG + TikTok", anchor:true, world:true, panelTags:["proof","health"], concept:"The Good Sh*t Bulletin: on Aug 12 the EU’s new packaging law starts applying and bans PFAS in food-contact packaging. Read flatly, like weather. The brand does not celebrate — it notes the rules are moving toward the drawer.", hooks:["on august 12 the EU bans PFAS in food-contact packaging. that is nine days.","the law is about to remove a chemical class from the stuff touching your food.","not a victory lap. just the news, read slowly."], rec:0, caption:"the good sh*t bulletin, august edition 🪱 on the 12th that big bloc-wide packaging law finally switches on, and among the very first things it strips out is PFAS from anything that touches food. that is the layer that touches the food. we are not going to pretend we made this happen. we are just going to note, quietly, that the rules keep moving in one direction and it is the direction the drawer already went. certificate is in the highlights. always has been.", lead:{ch:"Instagram",who:"the receipts audience — people who screenshot badges"}, shoot:{setup:"Bulletin format: Wormsley at a small desk with a single sheet of paper, reading. Deadpan newsreader energy, deliberately low-budget. One graphic card with the date.", cast:"Wormsley (prop / 2D puppet) + hands", tips:"Dry, not triumphant. Do NOT claim the brand influenced the law. Do NOT name a competitor. Date and scope must be exact — general application Aug 12, 2026, PFAS in food-contact packaging from the same date."}, edit:{hook:"Wormsley taps the page: ‘august twelfth.’", pace:"Slow, newsreader-flat.", captions:"Bulletin styling; short lines.", audio:"Dry room tone; a single stinger on the date card.", overlays:"‘EU PPWR applies Aug 12, 2026 · PFAS banned in food-contact packaging’.", length:"12–18s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Wormsley, desk, single sheet. Looks up.",txt:"the good sh*t bulletin."},{t:"4–10s",dofilm:"Date card. He reads it without inflection.",txt:"aug 12: PFAS banned in food-contact packaging."},{t:"10–16s",dofilm:"He sets the page down. Beat. The certificate in frame.",txt:"the rules are catching up."}], channels:[{k:"ig",who:"receipts audience",cut:"Lead cut — carousel with the regulation text and the home-compost certificate side by side."},{k:"tt",who:"policy-curious reach",cut:"Straight bulletin read; date card up front."}], test:{hyp:"A flat, non-triumphant regulatory read earns more saves and more trust than a celebratory we-were-right framing.",metric:"Saves and profile visits vs the pillar average; watch for any smug sentiment in comments."}, amplify:"Small boost timed to the Aug 12 landing, not before.", ladder:true, drove:["EU PPWR applies from Aug 12, 2026, with PFAS banned in food-contact packaging from the same date"], why:"Gives the Receipts pillar a dated, checkable news peg and lets the certification stand beside a real regulatory move without the brand claiming credit."},

{id:"RC-0803-2", pillar:"RC", dna:"good-sht-bulletin", plat:"IG", anchor:false, world:true, panelTags:["proof"], concept:"Open the certificate before anyone asks. Green-claims enforcement now reaches fines of up to 10% of global turnover — so the brand posts its own paperwork unprompted and invites the screenshot.", hooks:["fines for a fake eco claim now reach 10% of global turnover. we will go first.","here is our certificate. zoom in. we will wait.","being checkable is the whole flex."], rec:1, caption:"regulators can now fine a brand up to 10% of global turnover for an environmental claim it cannot back — no court required 🪱 so rather than wait to be asked, here is ours. home compostable, certified, the actual document, zoom as far in as you like. we are not doing this because we are brave. we are doing it because it is the cheapest thing in the world to do when it is true.", lead:{ch:"Instagram",who:"the screenshot-and-check crowd"}, shoot:{setup:"Flat-lay of the actual certification document under a phone camera, one hand pushing it into frame. Slow zoom to the standard and the issuing body. Deliberately unstyled — this is a document, not a hero shot.", cast:"Hands + the paperwork", tips:"Show the real document. Do NOT dress it. If a detail cannot be shown honestly, cut the shot rather than crop around it. Never name a rival."}, edit:{hook:"Hand slides the certificate into frame. ‘go on then.’", pace:"Unhurried; let the zoom do the work.", captions:"Minimal — the document is the content.", audio:"Room tone + paper.", overlays:"‘up to 10% of global turnover · no court required’ then the standard name.", length:"10–15s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Certificate pushed into frame under a phone light.",txt:"fines now reach 10% of turnover."},{t:"4–10s",dofilm:"Slow push in on the standard + issuing body.",txt:"so here is ours."},{t:"10–14s",dofilm:"Hand withdraws. Document sits there.",txt:"zoom in. we will wait."}], channels:[{k:"ig",who:"receipts audience",cut:"Lead cut — Reel plus a pinned Story so the certificate is one tap from the profile forever."}], test:{hyp:"Publishing the certificate unprompted, framed by the enforcement news, converts sceptics faster than answering claims questions reactively in comments.",metric:"Profile visits + saves; track whether claims questions in comments fall over the following fortnight."}, ladder:true, drove:["Green-claims enforcement now allows direct fines up to 10% of global turnover without court action"], why:"Turns a category-wide crackdown into an asset only a genuinely certified brand can use, and makes being checkable the personality trait rather than the compliance chore."},

{id:"RC-0803-3", pillar:"RC", dna:"good-sht-bulletin", plat:"IG", anchor:false, world:true, panelTags:["proof"], concept:"Teach the loophole. The compostable-specific rules under the new regulation do not bite until Feb 2028 — so right now the word is still largely self-graded. The brand explains the gap it is standing in.", hooks:["the compostable rules do not actually start until 2028. we are telling you anyway.","right now, ‘compostable’ is mostly a word brands grade themselves on.","here is the loophole. we are inside it too. that is the point."], rec:0, caption:"small print nobody will tell you 🪱 the new EU packaging law starts applying this month, but the rules written specifically for compostable packaging do not bite until february 2028. which means for the next eighteen months, ‘compostable’ is still largely a word brands mark their own homework on. we are inside that window like everyone else. the difference is ours already got marked by somebody else, and we will keep showing you the paper. teaching the loophole is not a risk when you are not using it.", lead:{ch:"Instagram",who:"the sceptics — the audience that assumes every green claim is soft"}, shoot:{setup:"Bulletin desk again, tighter and more conspiratorial — Wormsley leaning in slightly, as if sharing something he probably should not. One sheet, one date circled: FEB 2028.", cast:"Wormsley + hands", tips:"This only works because the brand is genuinely certified — the honesty IS the content. Do NOT imply rivals are lying; state the timeline and stop. Get the date right: compostable-specific requirements apply Feb 12, 2028."}, edit:{hook:"‘right. small print.’ Wormsley leans in.", pace:"Slightly quicker than the standard bulletin — this is a confidence.", captions:"Short, conspiratorial.", audio:"Dry room tone.", overlays:"‘compostable-specific rules apply Feb 12, 2028’ circled.", length:"15–20s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Wormsley leans in, taps the sheet.",txt:"small print. nobody will tell you this."},{t:"5–12s",dofilm:"FEB 2028 circled in view.",txt:"the compostable rules start in 2028."},{t:"12–18s",dofilm:"He shrugs. Certificate slides in beside it.",txt:"ours got marked early."}], channels:[{k:"ig",who:"sceptics + receipts audience",cut:"Lead cut — carousel with the two dates side by side."}], test:{hyp:"Volunteering the loophole the brand could hide behind builds more trust than any positive claim, and pre-empts the all-compostable-claims-are-greenwashing objection.",metric:"Comment sentiment shift on claims threads; saves vs pillar average."}, ladder:true, drove:["PPWR compostable-specific requirements do not apply until Feb 12, 2028"], why:"Converts the category’s weakest spot into the brand’s most disarming move — the one player willing to explain the gap it is standing in is the one nobody suspects."},

{id:"RC-0803-4", pillar:"RC", dna:"compost-reveal", plat:"IG + TikTok", anchor:true, world:true, panelTags:["proof","swap"], concept:"Which bin? A calm side-by-side on home versus industrial composting — no rival named, just the two bins and what actually happens in each. The enforcement wave makes this the brand’s most linkable asset.", hooks:["‘compostable’ and ‘compostable in a facility you cannot access’ are not the same sentence.","two bins. one of them is in your garden. that is the whole video.","which bin does it actually go in? nobody ever says."], rec:2, caption:"the question nobody in this category answers straight: which bin 🪱 industrial composting needs heat a household pile never reaches, in a facility a lot of people do not have access to. home compostable means your bin, your garden, no facility, no transport. both get called ‘compostable’ on packaging. only one of them happens in most people’s actual lives. we are not naming anyone. we are just going to keep showing you the two bins until the word means something again.", lead:{ch:"Instagram",who:"the swap-curious — people mid-decision at the shelf"}, shoot:{setup:"Two bins, physically, side by side in a real garden. The same piece of wrap in each. Interval cards showing what happens. The comparison is the whole idea — keep it literal and unglamorous.", cast:"Hands + two bins + product — no face required", tips:"Never name a rival. Never say a competitor is lying. Show the mechanism and let the audience arrive. Do not over-claim breakdown times — state the certified conditions and stay conservative."}, edit:{hook:"Two bins in frame. ‘right. which one.’", pace:"Patient — the reveal is the payoff.", captions:"Two-column, deliberately plain.", audio:"Garden ambience; no music under the reveal.", overlays:"‘HOME: your bin’ / ‘INDUSTRIAL: a facility’ labels; certified-conditions card at the end.", length:"20–30s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Two bins, labelled. Same wrap held over each.",txt:"same word. two different bins."},{t:"5–15s",dofilm:"Interval cards on the home bin.",txt:"home: your garden. no facility."},{t:"15–25s",dofilm:"Cut to the industrial explanation card.",txt:"industrial: heat you cannot make at home."},{t:"25–30s",dofilm:"End card with the certification.",txt:"ask which bin. every time."}], channels:[{k:"ig",who:"swap-curious",cut:"Lead cut — Reel plus a pinned highlight so it becomes the permanent answer to every claims question."},{k:"tt",who:"reach",cut:"Faster; the two-bin visual in the first second."}], test:{hyp:"A which-bin explainer becomes the brand’s most-linked evergreen asset and resolves claims arguments without the brand having to argue.",metric:"Saves + shares vs pillar average; track how often it gets pasted into comment threads."}, ladder:true, drove:["Rivals certify to ASTM D-6400, an industrial standard","Substantiation obligations attach to compostability claims from Aug 2026"], why:"Builds the evergreen asset the category is missing and turns the brand’s sharpest competitive difference into education rather than a fight."},

{id:"GS-0803-1", pillar:"GS", dna:"wormsley-bit", plat:"IG + TikTok", anchor:false, world:true, panelTags:["funny","character"], concept:"Week two. The challenge is over, the posting stopped, and this is the unglamorous stretch where the swap is either in your hand or behind the foil. Wormsley checks in. No gold star, no guilt.", hooks:["week two. nobody makes content about week two.","the hashtag is gone. i am still in the drawer.","checking in. not checking up."], rec:0, caption:"week two 🪱 the challenge ended, everyone stopped posting about it, and this is the bit nobody films — where a good decision either quietly became a habit or quietly became a thing behind the foil. no gold star if you kept it. no lecture if you did not. i am just here, in the drawer, same as last week. that is genuinely the whole update.", lead:{ch:"Instagram",who:"the community — people who made a swap last month"}, shoot:{setup:"Wormsley in a slightly-too-messy drawer, mid-afternoon light. Nothing happens. He waves. That is the bit — the anti-event.", cast:"Wormsley (prop / 2D puppet) in a real drawer", tips:"Do NOT name the July challenge and do NOT run any countdown or payoff framing — last week owned that, and repeating it reads as a brand stuck on its own campaign. This is smaller and quieter on purpose."}, edit:{hook:"Drawer opens. Wormsley is just there. ‘oh. hello.’", pace:"Deliberately uneventful.", captions:"Two lines maximum.", audio:"Room tone. Optionally one dry library bed.", overlays:"‘week two’ only.", length:"8–12s", aspect:"9:16"}, scenes:[{t:"0–4s",dofilm:"Drawer opens. Wormsley among the rolls.",txt:"week two."},{t:"4–8s",dofilm:"He waves. Nothing else occurs.",txt:"nobody makes content about week two."},{t:"8–12s",dofilm:"Drawer closes on him mid-wave.",txt:"still here."}], channels:[{k:"ig",who:"community",cut:"Lead cut — the drawer bit; reply to comments in character."},{k:"tt",who:"character audience",cut:"Same bit, tighter; lean on the anti-climax."}], test:{hyp:"An anti-event character post in the dead week outperforms a campaign recap, because the audience is done hearing about the campaign.",metric:"Comment volume and character-directed replies vs the pillar average."}, ladder:true, drove:["Week two is the quiet stretch where a July swap either stuck or did not"], why:"Keeps the character alive in a week with no news, without dragging last week’s campaign into a second lap."},

{id:"GS-0803-2", pillar:"GS", dna:"health-swap", plat:"IG", anchor:false, world:true, panelTags:["swap","easy"], concept:"One shelf. When the old roll runs out. The underconsumption-safe framing of the swap — explicitly not a haul, not a kit, not a lifestyle.", hooks:["do not throw anything away. finish the roll you have.","this is a one-shelf swap, not a personality.","buy it when the old one runs out. that is the whole plan."], rec:0, caption:"a thing we will never do is tell you to bin a perfectly good roll of plastic wrap to prove a point 🪱 finish it. genuinely. then when you are standing there about to buy the next one, buy this instead. that is the entire swap. one shelf, one decision, no kit, no starter bundle, no new habit to maintain. the smallest version of this that works is the version that lasts.", lead:{ch:"Instagram",who:"budget- and time-poor swap-curious — the easy-swap lane"}, shoot:{setup:"A drawer with a half-used roll of ordinary plastic wrap in it. The hand does nothing to it. Cut to the shop shelf, the moment of the next purchase. Deliberately anticlimactic.", cast:"Hands + drawer + shelf", tips:"Do NOT stage a throw-away or a declutter — that is the opposite of the message and this audience will punish it. Do not mention price unless it can be stated accurately."}, edit:{hook:"Half-used roll in the drawer. ‘keep it.’", pace:"Calm and practical.", captions:"Plain, instructional.", audio:"Quiet; no trend sound needed.", overlays:"‘finish it → then swap’ two-step card.", length:"12–15s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Drawer, half-used plastic roll. Hand leaves it alone.",txt:"finish the one you have."},{t:"5–10s",dofilm:"Shelf, the next-purchase moment.",txt:"then, at the shelf —"},{t:"10–15s",dofilm:"The swap goes in the basket. Nothing else changes.",txt:"one shelf. that is it."}], channels:[{k:"ig",who:"swap-curious",cut:"Lead cut — Reel with the two-step overlay; Story with the shelf link."}], test:{hyp:"Explicitly telling people not to throw the old product away outperforms any swap-now framing with the underconsumption-minded audience.",metric:"Saves and comment sentiment; watch for finally-a-brand-that-gets-it language as the qualitative signal."}, ladder:true, drove:["Underconsumption is the dominant register — hostile to hauls, friendly to like-for-like replacement"], why:"Removes the biggest objection in the category — that switching means buying a lifestyle — and reframes the product as the smallest possible change."},

{id:"GS-0803-3", amp:{headline:"Get in the restock cart", why:"Target, Amazon and Instacart opened back-to-school programmes together, pulling lunch-kit restock into the first fortnight of August. For a daily-use product, being in that cart beats arriving after it.", budget:100, window:"Aug 3 – 10", objective:"Link taps + first purchase during the restock window", guardrail:"No urgency theatre, no countdown, no last-chance. State the window plainly or not at all.", placements:[{platform:"Instagram", format:"Story + link", budget:55, reach:"Warm + parent lookalikes", audience:"Back-to-school restock, grocery, lunchbox", note:"Story is the restock-list format."},{platform:"TikTok", format:"In-feed", budget:45, reach:"Cold", audience:"Back-to-school haul + restock interests", note:"Ride haul-adjacent content without making a haul."}]}, pillar:"GS", dna:"moment-jack", plat:"IG + TikTok", anchor:true, world:true, panelTags:["swap","easy","moment"], concept:"The restock list. Everyone is writing one this week — pencils, socks, snacks. Wormsley adds one line to the bottom of it and says nothing else.", hooks:["your restock list is already written. one line missing.","pencils. socks. snacks. the wrap around the snacks.","it is the only thing on the list you buy once and use daily."], rec:1, caption:"restock season 🪱 the list is already on the fridge — pencils, socks, the snacks, the other snacks. we are just quietly adding one line near the bottom. it is the only item on there you will touch every single morning for the next four months, and it is the one nobody thinks to put on a list. finish the roll you have first. then, next shop, this one.", lead:{ch:"Instagram",who:"parents actively writing the restock list this fortnight"}, shoot:{setup:"A real handwritten restock list on a fridge. A hand adds one line at the bottom. Wormsley peers over the edge of the paper. Nothing more.", cast:"Hands + list + Wormsley", tips:"Do not manufacture urgency and do not invent a deadline. The window is real — say it plainly or leave it out. Keep the joke in the placement of the line, not in a punchline."}, edit:{hook:"Pen adds one line to the bottom of the list.", pace:"Brisk, matches the season’s energy.", captions:"List-styled.", audio:"Pen on paper; light bed.", overlays:"The list, legible; the added line highlighted.", length:"10–15s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Fridge list, already full. Hand approaches.",txt:"the list is already written."},{t:"5–10s",dofilm:"One line added at the bottom. Wormsley peers over.",txt:"one line missing."},{t:"10–15s",dofilm:"Roll in the basket. Done.",txt:"touched every morning. bought once."}], channels:[{k:"ig",who:"restocking parents",cut:"Lead cut — Story-first with the shelf link; Reel version for the grid."},{k:"tt",who:"reach",cut:"Haul-adjacent cut without being a haul; the list gag lands faster."}], test:{hyp:"Landing inside the restock-list moment converts better than any back-to-school creative arriving after the first week of term.",metric:"Link taps during Aug 3 – 10 vs the same creative rerun after Aug 17."}, amplify:"Concentrate spend across the first restock weekend, then stop.", ladder:true, drove:["Target, Amazon and Instacart opened back-to-school programmes together","The lunchbox aisle is reorganising around clean label"], why:"Puts the product inside a decision parents are actively making this fortnight, in the format they are already using to make it."},

{id:"GS-0803-4", pillar:"GS", dna:"reply-worm", plat:"IG + TikTok", anchor:false, world:true, panelTags:["funny","character","proof"], concept:"Reply in character to the hardest comment in the inbox — the PBAT question. Wormsley answers it straight, in voice, without defensiveness. The hard question is the content.", hooks:["‘isn’t PBAT still a plastic?’ — right. sit down. good question.","answering the comment everyone screenshots.","the hard one. in character. no dodging."], rec:0, caption:"someone asks this every single week and it deserves a straight answer, so 🪱 yes — the material chemistry is more complicated than a slogan, and anyone telling you a compostable wrap is simply ‘not plastic’ is simplifying. what matters is what happens at the end: certified to go back to nothing in a household heap in your own garden — not a processing plant you may never live near. that is the claim, that is what got certified, and that is the whole answer. ask us the hard one. we would rather have it in the comments than in your head.", lead:{ch:"Instagram",who:"the sceptics — and everyone reading the comments over their shoulder"}, shoot:{setup:"Screen-record of the actual comment (handle blurred), then cut to Wormsley answering directly to camera. Low production on purpose — this should feel like a reply, not a campaign.", cast:"Wormsley + the comment", tips:"Answer honestly including the uncomfortable part. Do NOT overclaim the material. If a specific breakdown claim cannot be substantiated from the certification, cut it. Blur the commenter’s handle."}, edit:{hook:"The comment fills the screen. ‘right. good one.’", pace:"Conversational, faster than the bulletin.", captions:"Reply-styled.", audio:"Room tone.", overlays:"The comment, then the certification standard.", length:"15–25s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"The comment on screen, handle blurred.",txt:"asked every week."},{t:"5–18s",dofilm:"Wormsley answers straight, including the awkward part.",txt:"the honest version."},{t:"18–24s",dofilm:"Certification card. He shrugs.",txt:"ask us the hard one."}], channels:[{k:"ig",who:"sceptics + community",cut:"Lead cut — Reel; then actually reply in character under the original comment."},{k:"tt",who:"reach",cut:"Comment-reply video format, native to the platform."}], test:{hyp:"Answering the hardest material question in character, honestly, converts more sceptics than any positive claim and reduces repeat questions.",metric:"Frequency of the same question over the following month; sentiment on claims threads."}, ladder:true, drove:["Green-claim scepticism is native comment-section behaviour"], why:"Turns the category’s most awkward question into owned content and proves the character can carry substance, not just jokes."},

{id:"FG-0803-2", pillar:"FG", dna:"moment-jack", plat:"TikTok + IG", anchor:false, world:true, panelTags:["moment","swap","funny"], concept:"Bento is the lunchbox format of the year, and bento is fundamentally about what touches what. Ride the format as a prop it already needed — no announcement, no pitch.", hooks:["bento is just organised wrapping. we are professionally relevant for once.","every compartment is a decision about what touches what.","the format already needed us. we just turned up."], rec:0, caption:"bento season and suddenly we are extremely relevant 🪱 the whole format is about separation — this does not touch that, that stays crisp, this one needs wrapping. we make the layer that does the wrapping. we are not going to pretend that is a coincidence, but we are also not going to make a whole speech about it. here is a very satisfying box. the wrap is in it. carry on.", lead:{ch:"TikTok",who:"the bento / pack-my-lunch format audience"}, shoot:{setup:"Full bento assembly, straight down, satisfying and unhurried. Every compartment fills. The wrapped parcel goes in like any other component — no lingering, no hero shot on the product.", cast:"Hands only", tips:"Do NOT make the product the star — the format punishes an ad. It is one component among many. If the cut reads as a commercial, remove a beat of product and add a beat of food."}, edit:{hook:"Empty bento box. First compartment fills.", pace:"ASMR-satisfying; let it breathe.", captions:"Almost none — the format carries it.", audio:"TikTok: pull a live bento / pack-my-lunch sound · IG: soft ASMR.", overlays:"Minimal; one dry line at the end only.", length:"20–30s", aspect:"9:16"}, scenes:[{t:"0–8s",dofilm:"Compartments fill in sequence. Colour, order, satisfaction.",txt:"—"},{t:"8–18s",dofilm:"The wrapped parcel goes in, no special treatment.",txt:"—"},{t:"18–26s",dofilm:"Lid on. One dry line lands.",txt:"organised wrapping. our whole thing."}], channels:[{k:"tt",who:"format audience",cut:"Lead cut — full ASMR assembly on a live sound."},{k:"ig",who:"parents",cut:"Slightly shorter; the dry line lands two seconds earlier."}], test:{hyp:"Appearing as an unremarked component inside a native format outperforms any cut that draws attention to the product.",metric:"Completion rate and shares vs pillar average; compare directly against a product-forward alternate cut."}, ladder:true, drove:["Aesthetic bento is carrying the lunchbox lane"], why:"Rides the season’s dominant format from inside it, where the product is a prop the format already wanted rather than a sponsor bolted on."},

{id:"FG-0803-3", pillar:"FG", dna:"plastic-villain", plat:"IG + TikTok", anchor:false, world:true, panelTags:["health","proof"], concept:"Plastic wrap performs worst when heated, stretched over oily food, or reused — which is a precise description of a lunchbox. The villain bit, delivered as a coincidence rather than an accusation.", hooks:["plastic wrap is fine, actually — cold, dry, and used once.","a lunchbox is warm, oily and sat in a bag for four hours. hm.","we are not saying it is a villain. we are reading its own conditions back."], rec:0, caption:"in fairness to plastic wrap 🪱 it is relatively stable when it is cold, dry and used once. the trouble is the conditions where it sheds most are heat, oily or acidic food, stretching, and reuse. now describe a lunchbox to me. warm bag, four hours, something buttery, wrapped tight, sometimes the same piece twice. we did not write those conditions. we are just noticing they rhyme.", lead:{ch:"Instagram",who:"the health-driven parent — not the planet-driven one"}, shoot:{setup:"Two columns built on screen: the conditions plastic wrap is stable in, versus the conditions inside a lunch bag. Built physically if possible — two cards, hands placing them. The rhyme does the work.", cast:"Hands + cards + product", tips:"Frame as an observation, never an accusation, and never imply a parent has harmed a child. Keep every claim inside what the sources support — stable cold and dry, sheds more when heated, oily, stretched or reused."}, edit:{hook:"Card one: ‘plastic wrap is stable when…’", pace:"Even, two-column rhythm.", captions:"Two-column, deliberately neutral.", audio:"Dry; no ominous music — that tips into fear.", overlays:"The two condition lists, side by side.", length:"15–20s", aspect:"9:16"}, scenes:[{t:"0–6s",dofilm:"Column one built: cold, dry, single use.",txt:"where it behaves."},{t:"6–14s",dofilm:"Column two: warm bag, oily food, four hours, reused.",txt:"where it lives."},{t:"14–20s",dofilm:"Wormsley looks between the two columns. Says nothing.",txt:"we just noticed they rhyme."}], channels:[{k:"ig",who:"health-driven parents",cut:"Lead cut — carousel version so the two columns can be read slowly."},{k:"tt",who:"reach",cut:"Faster build; the rhyme lands as the punchline."}], test:{hyp:"An observational villain bit converts better than a direct health warning, because this audience resents being alarmed but enjoys noticing.",metric:"Saves vs pillar average; watch comments for any scaremongering read and pull the cut if it appears."}, ladder:true, drove:["Plastic wrap sheds most when heated, stretched over oily food, or reused","School-lunch packaging sheds nano- and microplastics and leaches additives"], why:"Lands the health argument without fear-farming, by letting the product’s own stated conditions do the accusing."},

{id:"CW-0803-1", amp:{headline:"Restock creator seeding", why:"Owned-feed posts run around a dozen units of engagement; a real person filming in their own kitchen runs an order of magnitude higher. August restock is when that footage is being made anyway.", budget:70, window:"Aug 3 – 17", objective:"Seeded UGC volume + whitelisting rights on the best cuts", guardrail:"Gift, do not script. No mandated talking points beyond the which-bin fact. Never require a child on camera.", placements:[{platform:"Instagram", format:"Seeding + whitelist", budget:45, reach:"Creator audiences", audience:"Home-hacks, low-tox parent, organisation creators", note:"Whitelist the best restock cut rather than briefing a new one."},{platform:"TikTok", format:"Spark Ad on seeded UGC", budget:25, reach:"Cold", audience:"Restock + organisation interests", note:"Boost whatever performs organically; do not pre-pick."}]}, pillar:"CW", dna:"caught-in-wild", plat:"IG + TikTok", anchor:true, world:true, panelTags:["proof","swap","easy"], concept:"Get into other people’s drawers. Seed rolls to home-hacks and low-tox parent creators during restock-and-organise season, when they are already filming their kitchens, and whitelist the best of it.", hooks:["our best content is filmed in someone else’s kitchen. every time.","restock season means everyone is already filming their drawers.","we are not briefing a video. we are just turning up in the drawer."], rec:0, caption:"the most effective thing we post is almost never ours 🪱 a real person restocking a real drawer outperforms our own feed by roughly an order of magnitude, and august is when everybody is filming exactly that anyway. so we are not commissioning content this month. we are just making sure the roll is on the shelf when the camera comes out. if you have already got one in your drawer — film it badly, tag us, we will probably repost it.", lead:{ch:"Instagram",who:"creator audiences via seeded UGC, then whitelisted"}, shoot:{setup:"Not a brand shoot. The output is other people’s footage — the brand’s job is the seeding kit and the repost frame. Any brand-shot element is a simple call-out card inviting tags.", cast:"Creators in their own kitchens — no brand cast", tips:"Gift, never script. Do not require the microplastics number or any regulatory language. One optional fact only — which bin. Never ask for a child on camera."}, edit:{hook:"A stranger’s drawer, mid-restock. Not ours.", pace:"Whatever the creator’s native pace is — do not re-edit.", captions:"Keep the creator’s own captions.", audio:"Creator’s original audio; do not replace.", overlays:"Light repost frame only.", length:"Native", aspect:"9:16"}, scenes:[{t:"0–6s",dofilm:"Seeded creator footage — real drawer, real restock.",txt:"someone else’s kitchen."},{t:"6–15s",dofilm:"The swap appears without commentary.",txt:"no script. no brief."},{t:"15–20s",dofilm:"Brand repost frame + tag invitation.",txt:"film it badly. tag us."}], channels:[{k:"ig",who:"creator + community",cut:"Lead cut — repost the best seeded restock cuts; whitelist the top performer."},{k:"tt",who:"reach",cut:"Spark Ad behind whichever seeded cut wins organically."}], test:{hyp:"Seeding into an existing restock-filming habit produces more usable footage per pound than commissioning briefed content.",metric:"Usable cuts per unit seeded, and cost per thousand views on whitelisted UGC vs owned-feed posts."}, amplify:"Whitelist and boost the top-performing seeded cut rather than a brand-shot asset.", ladder:true, drove:["Real-kitchen UGC outperforms the owned feed by roughly an order of magnitude","Restock-and-organise is peak filming season"], why:"Buys the brand’s highest-performing content format at its cheapest moment of the year, by arriving during a filming habit that already exists."},

{id:"CW-0803-2", pillar:"CW", dna:"torture-test", plat:"TikTok + IG", anchor:false, world:true, panelTags:["proof","swap"], concept:"The lunchbox torture test. Wrap it at 7am, open it at 12:30 after a school bag, a bus and a playground. Does it hold? Filmed honestly, including if it does not.", hooks:["wrapped at 7am. opened at half twelve. let us see.","the only test that matters is the one that ends at lunchtime.","five hours in a school bag. no cuts."], rec:1, caption:"the only performance test that actually matters here 🪱 wrapped at 7am, into a bag, onto a bus, under a PE kit, opened at 12:30. we filmed the whole thing and we did not reshoot the bad one. because ‘it is compostable’ is meaningless if the sandwich is dry by lunch — the swap only counts if it does the job first and the planet thing second. verdict in the video.", lead:{ch:"TikTok",who:"the does-it-actually-work objection"}, shoot:{setup:"Single continuous premise: wrap at 7am with a visible clock, bag it, follow it through the day in short stamped cuts, open at 12:30 on camera. Real bag, real journey. No studio.", cast:"Hands + a real bag + a real sandwich", tips:"Show the honest result. If it underperforms in any condition, show that too and say what it is good for instead — the receipts rule outranks the sales pitch. Do not fake the timestamps."}, edit:{hook:"Clock at 7:02. Sandwich wrapped.", pace:"Time-stamped cuts, building to the open.", captions:"Timestamps as the structure.", audio:"Real ambience; no tension music.", overlays:"Running clock; final verdict card.", length:"20–30s", aspect:"9:16"}, scenes:[{t:"0–6s",dofilm:"7:02am. Wrapped, sealed, into the bag.",txt:"wrapped at seven."},{t:"6–16s",dofilm:"Stamped cuts — bus, bag, playground, squashed.",txt:"five hours. one school bag."},{t:"16–26s",dofilm:"12:30. Opened on camera. Honest verdict.",txt:"still sealed?"},{t:"26–30s",dofilm:"Verdict card, including any caveat.",txt:"the honest result."}], channels:[{k:"tt",who:"proof-seekers",cut:"Lead cut — the full test, no edits at the reveal."},{k:"ig",who:"parents",cut:"Shorter; verdict card up front for the feed, full test in Stories."}], test:{hyp:"An honest performance test that admits limitations converts the does-it-actually-work objection better than any claim of parity.",metric:"Comment shift from performance doubt to purchase intent; saves vs pillar average."}, ladder:true, drove:["Performance parity is the core objection for the easy-swap audience"], why:"Answers the one question blocking the sale, in the exact use case the week is about, and earns credibility by being willing to publish a bad result."},

{id:"CW-0803-3", pillar:"CW", dna:"caught-in-wild", plat:"IG", anchor:false, world:true, panelTags:["character","funny","swap"], concept:"Spotted in the wild: the roll appearing in someone else’s back-to-school restock post, unprompted. The brand reposts with Wormsley reacting as if recognised in public.", hooks:["found him in a stranger’s drawer. he is thrilled.","unpaid. unprompted. deeply smug about it.","spotted in the wild: one of ours, in someone else’s august."], rec:0, caption:"caught in the wild 🪱 no brief, no gifting, no arrangement — just a roll of ours sat in the back of somebody’s restock video like it lives there. which, to be fair, it does. he has not stopped talking about it. if yours turns up in a video, tag us and we will make a whole thing of it, because we genuinely will.", lead:{ch:"Instagram",who:"community — the reposted creator’s audience comes with it"}, shoot:{setup:"Screen-record of the found footage, then Wormsley reacting beside it — preening slightly. The joke is the disproportionate pride.", cast:"Wormsley + found footage (permission first)", tips:"Always get permission and credit before reposting. Do not imply a paid relationship where none exists, and do not repost anything featuring a child’s face without explicit consent."}, edit:{hook:"Found clip plays. Wormsley leans into frame.", pace:"Quick; the reaction is the payoff.", captions:"Reaction-styled.", audio:"Original clip audio + a dry sting.", overlays:"‘caught in the wild’ stamp; creator credit visible.", length:"10–15s", aspect:"9:16"}, scenes:[{t:"0–5s",dofilm:"Found restock footage, roll visible in the background.",txt:"not ours. not paid."},{t:"5–11s",dofilm:"Wormsley preens beside the frame.",txt:"he has been recognised."},{t:"11–15s",dofilm:"Credit card + tag invitation.",txt:"tag us. we will make a thing of it."}], channels:[{k:"ig",who:"community",cut:"Lead cut — repost with credit; reply in character under the original."}], test:{hyp:"Celebrating unpaid appearances produces more unpaid appearances, because being reposted by the brand becomes a small prize.",metric:"Volume of unprompted tags over the following month vs the prior month."}, ladder:true, drove:["Restock-and-organise season puts the product in other people’s footage"], why:"Rewards the behaviour the brand most wants to multiply, and gives the character a reason to exist outside the brand’s own content."}
